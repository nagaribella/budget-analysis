<script>
/* ---------- SAVINGS: month by month, toward one overall target ----------
   "Saved" in a month = salary + extra income − spending in that pay cycle.
   Closed months count as real savings. The current month is a projection until payday. */
function savingsStats() {
  const g = S.settings.savingsGoal || {}, overall = Number(g.target) || 0, start = Number(g.start) || 0;
  let run = start;
  const rows = cyclesAsc().map(c => {
    const k = calc(c), inc = k.income + k.extra, live = !k.isPast, saved = live ? k.projected : inc - k.spent;
    const r = { c, k, inc, saved, live, target: k.target, label: fd(c.start, { month: 'short', year: 'numeric' }),
      range: `${fd(c.start)} – ${fd(addDays(c.payday, -1))}`, hit: k.target > 0 ? saved / k.target : null };
    if (!live) { run += saved; r.cum = run; } else r.cum = run + saved;
    return r;
  });
  const closed = rows.filter(r => !r.live), cur = rows.find(r => r.live && r.k.isCur);
  const total = start + sumA(closed.map(r => r.saved));
  const withCur = total + (cur ? cur.saved : 0);
  let monthsLeft = null;
  if (g.by && cur) { const [y, m] = g.by.split('-').map(Number), s = pd(cur.c.start); monthsLeft = Math.max(1, (y - s.getFullYear()) * 12 + (m - 1 - s.getMonth()) + 1); }
  const withTarget = closed.filter(r => r.target > 0);
  return { g, overall, start, by: g.by || '', rows, closed, cur, total, withCur, monthsLeft,
    hits: withTarget.filter(r => r.saved >= r.target).length, ofTargets: withTarget.length,
    avg: closed.length ? sumA(closed.map(r => r.saved)) / closed.length : 0,
    avgRate: closed.length ? sumA(closed.map(r => r.inc ? r.saved / r.inc : 0)) / closed.length : 0,
    best: closed.slice().sort((a, b) => b.saved - a.saved)[0] || null };
}
const MONTH_COLORS = ['#0A5CC2', '#1E86EE', '#12915A', '#7B4BC4', '#F59E0B', '#0F9BAA', '#D9468F', '#5C6BC0', '#2E7D32', '#B26A00', '#00838F', '#6D4C41'];
function savingsRecap() {
  const s = savingsStats(), t = s.overall;
  const pctAll = t ? s.total / t : 0, pctWith = t ? s.withCur / t : 0;
  const need = t && s.monthsLeft ? Math.max(0, (t - s.withCur) / Math.max(1, s.monthsLeft - (s.cur ? 1 : 0))) : 0;
  const planned = s.cur ? s.cur.target : 0;
  // overall progress bar: one segment per month, so you see what each month contributed
  const segs = !t ? '' : (s.start > 0 ? `<i style="width:${clamp(s.start / t * 100, 0, 100)}%;background:#94A3B8" title="Savings before Budget.in: ${rp(s.start)}"></i>` : '') +
    s.rows.filter(r => r.saved > 0).map((r, i) => `<i style="width:${clamp(r.saved / t * 100, 0, 100)}%;background:${MONTH_COLORS[i % MONTH_COLORS.length]};${r.live ? 'opacity:.45' : ''}" title="${r.label}: ${rp(r.saved)}${r.live ? ' (projected)' : ''}"></i>`).join('');
  const head = t ? `
    <div class="between" style="align-items:flex-end;flex-wrap:nowrap">
      <div style="min-width:0"><small class="mute small" style="font-weight:600">Total saved</small><div class="num" style="font-size:clamp(22px,6.6vw,30px);font-weight:800;line-height:1.1">${rp(s.total)}</div>
        <p class="small mute">of ${rp(t)} target${s.by ? ` by ${fd(s.by + '-01', { month: 'long', year: 'numeric' })}` : ''}</p></div>
      <div style="text-align:right;flex:none;max-width:45%"><div class="num" style="font-size:clamp(22px,6.6vw,30px);font-weight:800;color:var(--brand);line-height:1.1">${pct(pctAll)}</div><p class="tiny mute">${s.cur ? `${pct(pctWith)} incl. this month` : 'reached'}</p></div>
    </div>
    <div class="mix" style="height:18px;margin-top:12px;border-radius:9px">${segs}</div>
    <div class="legend">${s.start > 0 ? `<span><i class="dot" style="background:#94A3B8"></i>Before the app ${short(s.start)}</span>` : ''}${s.rows.filter(r => r.saved > 0).map((r, i) => `<span><i class="dot" style="background:${MONTH_COLORS[i % MONTH_COLORS.length]};${r.live ? 'opacity:.45' : ''}"></i>${r.label} ${short(r.saved)}${r.live ? ' (so far, projected)' : ''}</span>`).join('')}</div>
    ${s.monthsLeft ? `<div class="nudge ${need <= planned ? 'good' : ''}" style="margin-top:12px"><span class="ic">🎯</span><p>${s.withCur >= t ? 'At this pace you reach your overall target. Well done.' :
      `To reach ${rp(t)} by ${fd(s.by + '-01', { month: 'short', year: 'numeric' })}, save about <b>${rp(need)}</b> a month for the remaining ${s.monthsLeft - (s.cur ? 1 : 0)} month${s.monthsLeft - (s.cur ? 1 : 0) === 1 ? '' : 's'}. ${planned ? (need <= planned ? `Your current plan saves ${rp(planned)} a month, so you're on track.` : `Your current plan saves ${rp(planned)} a month, which is ${rp(need - planned)} short.`) : ''}`}</p></div>` : ''}`
    : `<div class="nudge"><span class="ic">🎯</span><div><p>Set one overall savings target to see your total progress and what each month adds to it.${planned > 0 ? ` Your plan saves about ${rp(planned)} a month, which is ${rp(planned * 12)} over a year.` : ''}</p><button class="btn sm act" data-act="starget">Set overall target</button></div></div>`;
  const stats = `<div class="kv" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
    <div><small>Months target hit</small><b class="num">${s.ofTargets ? `${s.hits} of ${s.ofTargets}` : '–'}</b></div>
    <div><small>Average per month</small><b class="num">${s.closed.length ? rp(s.avg) : '–'}</b></div>
    <div><small>Average savings rate</small><b class="num">${s.closed.length ? pct(s.avgRate) : '–'}</b></div>
    <div><small>Best month</small><b class="num">${s.best ? `${s.best.label.split(' ')[0]}: ${short(s.best.saved)}` : '–'}</b></div></div>`;
  const ofAll = r => t ? `${pct(r.saved / t)}` : '–';
  const hitPill = r => r.hit === null ? '<span class="pill off">No target</span>' : `<span class="pill ${r.live ? '' : r.saved >= r.target ? 'ok' : r.saved >= 0 ? 'watch' : 'over'}">${pct(r.hit)}${r.live ? ' proj.' : ''}</span>`;
  const rowsDesc = s.rows.slice().reverse();
  const table = `<div class="only-d scrollx" style="margin-top:14px"><table class="logt"><thead><tr>
      <th>Month</th><th class="r">Income</th><th class="r">Spent</th><th class="r">Saved</th><th class="r">Month target</th><th class="r">Target hit</th><th class="r">Of overall</th><th class="r">Total so far</th></tr></thead><tbody>
    ${rowsDesc.map(r => `<tr class="tap" data-act="open-recap" data-id="${esc(r.c.id)}"><td><b>${r.label}</b><div class="tiny mute">${r.range}${r.live ? ', in progress' : ''}</div></td>
      <td class="r num" style="font-weight:500">${rp(r.inc)}</td><td class="r num" style="font-weight:500">${rp(r.k.spent)}</td>
      <td class="r num" style="color:${r.saved < 0 ? 'var(--bad)' : 'var(--ok)'}">${rp(r.saved)}</td><td class="r num" style="font-weight:500">${rp(r.target)}</td>
      <td class="r">${hitPill(r)}</td><td class="r num">${ofAll(r)}</td><td class="r num">${rp(r.cum)}${t ? `<div class="tiny mute">${pct(r.cum / t)} of target</div>` : ''}</td></tr>`).join('')}
    </tbody></table></div>`;
  const cards = `<div class="only-m" style="margin-top:12px">${rowsDesc.map(r => `<div class="cat" data-act="open-recap" data-id="${esc(r.c.id)}">
      <div class="t"><div class="n"><b>${r.label}${r.live ? ' (now)' : ''}</b><span>${r.range}</span></div>
        <div class="r num"><b style="color:${r.saved < 0 ? 'var(--bad)' : 'var(--ok)'}">${rp(r.saved)}</b><span class="mute">of ${rp(r.target)}${r.live ? ' projected' : ''}</span></div>${hitPill(r)}</div>
      <div class="bar"><i style="width:${r.target > 0 ? clamp(r.saved / r.target * 100, 0, 100) : 0}%;background:${r.live ? 'var(--brand-soft)' : r.saved >= r.target ? 'var(--ok)' : 'var(--warn)'}"></i></div>
      <p class="tiny mute" style="margin-top:6px">Income ${rp(r.inc)}, spent ${rp(r.k.spent)}.${t ? ` Adds ${ofAll(r)} to your overall target, total now ${rp(r.cum)} (${pct(r.cum / t)}).` : ''}</p>
    </div>`).join('')}</div>`;
  return `<section class="card">
    <div class="card-h"><div><h2>Savings, month by month</h2><p>Saved = salary + extra income − spending, per pay cycle. Tap a month to open its recap.</p></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">${t ? '<button class="link" data-act="starget">Edit overall target</button>' : ''}<button class="link" data-act="basics">Edit this month's target</button></div></div>
    ${head}${stats}${table}${cards}
  </section>`;
}
function sheetSTarget() {
  const g = S.settings.savingsGoal || {}, c = curCycle(), plan = c ? calc(c).target : 0;
  return `${sheetHead('Overall savings target', 'One big number for all your months together.')}
    <div class="fg">
      <div class="full"><label class="f" for="st-t">Target amount</label><input id="st-t" class="money" inputmode="numeric" value="${mval(g.target)}" placeholder="${plan > 0 ? mval(plan * 12) : 'e.g. 50.000.000'}" autofocus></div>
      <div class="full"><label class="f" for="st-by">Reach it by (optional)</label><input id="st-by" type="month" value="${esc(g.by || '')}"></div>
      <div class="full"><label class="f" for="st-s">Savings you already had before using Budget.in</label><input id="st-s" class="money" inputmode="numeric" value="${mval(g.start)}" placeholder="0">
        <p class="hint">Counted toward the total, so your progress starts from where you really are.</p></div>
    </div>
    <div class="foot"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="starget-save">Save target</button></div>`;
}
</script>
<script>
/* ---------- REPORTS: Savings page ---------- */
function viewSavings() {
  const parts = moneyParts();
  return `${repSeg()}${savingsRecap()}
    <div class="grid two" style="margin-top:14px"><div class="col">${parts.goals}</div><div class="col">${parts.wish}</div></div>`;
}

/* ---------- REPORTS: Monthly recap dashboard ---------- */
function viewRecap() {
  let c = S.cycles.find(x => x.id === S.recapId);
  if (!c) { c = curCycle(); const cb = bounds(c); if (cb.prev && diffDays(c.start, today()) < 5) c = cb.prev; S.recapId = c.id; }  // early in a new cycle, show the month that just ended
  const k = calc(c), b = k.b, t = today();
  const prev = b.prev ? calc(b.prev) : null, label = fd(c.start, { month: 'long', year: 'numeric' });
  const inc = k.income + k.extra, saved = k.isPast ? inc - k.spent : k.projected, n = k.elapsed || 0;
  const hit = k.target > 0 ? saved / k.target : null;
  // previous cycle, same number of days, so mid-month comparisons stay fair
  const prevSame = prev ? sumE(prev.exp.filter(e => diffDays(prev.c.start, e.date) < n)) : 0;
  const prevBy = {}; if (prev) prev.exp.filter(e => diffDays(prev.c.start, e.date) < n).forEach(e => prevBy[e.category] = (prevBy[e.category] || 0) + e.amount);
  const chg = prevSame ? (k.spent - prevSame) / prevSame : null;
  const arrow = (v, goodDown = true) => v === null ? '' : `<span class="small" style="font-weight:700;color:${(v > 0) === goodDown ? 'var(--bad)' : 'var(--ok)'}">${v > 0 ? '▲' : '▼'} ${pct(Math.abs(v))}</span>`;
  const prevSaved = prev ? (prev.isPast ? prev.income + prev.extra - prev.spent : prev.projected) : null;

  // highlights, written from the numbers
  const H = [];
  if (hit !== null) H.push(k.isPast ? `You saved <b>${rp(saved)}</b>, ${pct(hit)} of your ${rp(k.target)} target. ${saved >= k.target ? 'Target hit.' : `${rp(k.target - saved)} short.`}`
    : `On course to save <b>${rp(saved)}</b> by payday, ${pct(hit)} of your ${rp(k.target)} target.`);
  const over = k.lines.filter(l => l.total > 0 && l.spent > l.total).sort((a, b) => (b.spent - b.total) - (a.spent - a.total))[0];
  if (over) H.push(`<b>${esc(over.name)}</b> went over plan by ${rp(over.spent - over.total)} (${pct(over.ratio)} used).`);
  if (k.isPast) { const under = k.lines.filter(l => l.kind === 'flex' && l.total > 0 && l.spent < l.total).sort((a, b) => (b.total - b.spent) - (a.total - a.spent))[0];
    if (under) H.push(`<b>${esc(under.name)}</b> came in ${rp(under.total - under.spent)} under plan.`); }
  if (chg !== null) H.push(`Spending is ${chg > 0 ? 'up' : 'down'} <b>${pct(Math.abs(chg))}</b> compared with the first ${n} days of ${fd(prev.c.start, { month: 'long' })}.`);
  const incr = Object.keys(k.spentBy).map(nm => ({ nm, d: (k.spentBy[nm] || 0) - (prevBy[nm] || 0) })).sort((a, b) => b.d - a.d)[0];
  if (prev && incr && incr.d > 0) H.push(`The biggest increase is <b>${esc(incr.nm)}</b>, ${rp(incr.d)} more than last month.`);
  const st = foodStats(k);
  if (st && st.pastN) H.push(`Food stayed within each day's budget on <b>${st.pastN - st.overDays} of ${st.pastN}</b> days${k.isCur ? `, and today's food budget is ${rp(st.todayBudget)}` : `, ending with ${st.endCarry >= 0 ? rp(st.endCarry) + ' unused' : rp(-st.endCarry) + ' over'}`}.`);
  if (k.unplanned.length) H.push(`Spending outside the plan: ${k.unplanned.map(u => `${esc(u.name)} ${rp(u.spent)}`).join(', ')}.`);

  // categories, biggest first
  const cats = k.lines.filter(l => l.total || l.spent).concat(k.unplanned.map(u => ({ name: u.name, total: 0, spent: u.spent, ratio: Infinity })))
    .sort((a, b) => b.spent - a.spent);
  const catRows = cats.map(l => {
    const d = l.total - l.spent, share = k.spent ? l.spent / k.spent : 0, w = l.total ? clamp(l.spent / l.total * 100, 0, 100) : 100;
    return `<div class="cat" style="cursor:default"><div class="t"><span class="dot" style="background:${colorOf(l.name)}"></span>
      <div class="n"><b>${esc(l.name)}</b><span>${rp(l.spent)} of ${l.total ? rp(l.total) : 'no plan'}. ${pct(share)} of spending</span></div>
      <div class="r num"><b style="color:${!l.total || d < 0 ? 'var(--bad)' : 'var(--ok)'}">${l.total ? (d >= 0 ? rp(d) : '−' + rp(-d).replace('−', '')) : '−' + rp(l.spent)}</b><span class="mute">${!l.total ? 'not planned' : d >= 0 ? 'left' : 'over'}</span></div></div>
      <div class="bar"><i style="width:${w}%;background:${!l.total || d < 0 ? 'var(--bad)' : colorOf(l.name)}"></i></div></div>`;
  }).join('');
  const top6 = cats.filter(x => x.spent > 0).slice(0, 6), rest = Math.max(0, k.spent - sumA(top6.map(x => x.spent)));
  const mix = k.spent ? `<div class="mix" style="height:16px">${top6.map(x => `<i style="width:${x.spent / k.spent * 100}%;background:${colorOf(x.name)}"></i>`).join('')}${rest ? `<i style="width:${rest / k.spent * 100}%;background:#94A3B8"></i>` : ''}</div>
    <div class="legend">${top6.map(x => `<span><i class="dot" style="background:${colorOf(x.name)}"></i>${esc(x.name)} ${pct(x.spent / k.spent)}</span>`).join('')}${rest ? `<span><i class="dot" style="background:#94A3B8"></i>Other ${pct(rest / k.spent)}</span>` : ''}</div>` : '';

  // daily chart: total per day, food part in purple, average as a dashed line
  const fn = foodNames(), tot = Array(k.days).fill(0), food = Array(k.days).fill(0);
  k.exp.forEach(e => { const i = diffDays(c.start, e.date); if (i >= 0 && i < k.days) { tot[i] += e.amount; if (fn.has(e.category)) food[i] += e.amount; } });
  const shown = k.isCur ? n : k.days, vals = tot.slice(0, shown).filter(Boolean).sort((a, b) => a - b);
  const cap = Math.max(1, (vals[Math.floor(vals.length * .85)] || 1) * 1.3), W = 320, Hh = 110, bw = W / k.days;
  const avg = shown ? sumA(tot.slice(0, shown)) / shown : 0;
  const bars = tot.map((v, i) => { if (i >= shown) return ''; const h = clamp(v / cap, 0, 1) * (Hh - 16), fh = v ? h * food[i] / v : 0, x = (i * bw + .5).toFixed(1), w = Math.max(1.5, bw - 1.5).toFixed(1);
    return `<rect x="${x}" y="${(Hh - 12 - h).toFixed(1)}" width="${w}" height="${h.toFixed(1)}" rx="1.5" style="fill:color-mix(in srgb,var(--ok) 55%,transparent)"><title>${fd(addDays(c.start, i))}: ${rp(v)}, food ${rp(food[i])}</title></rect>
      <rect x="${x}" y="${(Hh - 12 - fh).toFixed(1)}" width="${w}" height="${fh.toFixed(1)}" rx="1.5" style="fill:var(--food)"/>`; }).join('');
  const ay = (Hh - 12 - clamp(avg / cap, 0, 1) * (Hh - 16)).toFixed(1);
  const chart = `<svg viewBox="0 0 ${W} ${Hh}" style="width:100%;height:auto;display:block" role="img" aria-label="Spending per day; purple is food">${bars}
    <line x1="0" x2="${W}" y1="${ay}" y2="${ay}" style="stroke:var(--ink2);stroke-dasharray:4 3;stroke-width:1"/>
    <text x="0" y="${Hh - 1}" style="font:600 9px var(--sans);fill:var(--mute)">${fd(c.start)}</text><text x="${W}" y="${Hh - 1}" text-anchor="end" style="font:600 9px var(--sans);fill:var(--mute)">${fd(addDays(c.payday, -1))}</text></svg>
    <div class="legend lg"><span><i style="background:color-mix(in srgb,var(--ok) 55%,transparent)"></i>Total per day</span><span><i style="background:var(--food)"></i>Food</span><span>- - Average ${rp(avg)}</span></div>`;

  const topTx = k.exp.slice().sort((a, b) => b.amount - a.amount).slice(0, 5);
  const freqM = new Map(); k.exp.forEach(e => { const key = e.item.trim().toLowerCase(); const m = freqM.get(key) || { item: e.item, n: 0, total: 0, cat: e.category }; m.n++; m.total += e.amount; freqM.set(key, m); });
  const freq = [...freqM.values()].filter(m => m.n > 1).sort((a, b) => b.n - a.n || b.total - a.total).slice(0, 5);
  const accM = {}; k.exp.forEach(e => accM[e.account || 'No account'] = (accM[e.account || 'No account'] || 0) + e.amount);
  const accs = Object.entries(accM).sort((a, b) => b[1] - a[1]), accMax = Math.max(1, ...accs.map(a => a[1]));
  const wk = [0,0,0,0,0,0,0], wc = [0,0,0,0,0,0,0];
  for (let i = 0; i < shown; i++) { const d = pd(addDays(c.start, i)).getDay(); wk[d] += tot[i]; wc[d]++; }
  const wa = wk.map((v, i) => wc[i] ? v / wc[i] : 0), wmax = Math.max(1, ...wa), wtop = wa.indexOf(Math.max(...wa)), WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const bills = k.c.bills || [], billsPaid = sumA(bills.map(x => x.paidAmount || (x.paid ? x.amount : 0)));
  const li = (a, b2, r, color = '') => `<div class="li"><div class="main"><b>${a}</b><span>${b2}</span></div><div class="amt num" ${color ? `style="color:${color}"` : ''}>${r}</div></div>`;

  return `${repSeg()}
  <div class="cyc">
    <button class="iconbtn" data-act="rcyc" data-d="-1" ${b.prev ? '' : 'disabled'} aria-label="Previous month">${ic('left', 18)}</button>
    <div class="t"><b>${label}</b><span class="small mute">${fd(c.start)} – ${fd(addDays(c.payday, -1))}${k.isCur ? `, day ${n} of ${k.days}` : ''}</span></div>
    <button class="iconbtn" data-act="rcyc" data-d="1" ${b.next ? '' : 'disabled'} aria-label="Next month">${ic('right', 18)}</button>
  </div>
  <section class="card">
    <div class="kv" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
      <div><small>Income</small><b class="num">${rp(inc)}</b><span class="tiny mute">${k.extra ? `incl. ${rp(k.extra)} extra` : 'salary'}</span></div>
      <div><small>Spent</small><b class="num">${rp(k.spent)}</b>${arrow(chg)}</div>
      <div><small>${k.isPast ? 'Saved' : 'Saved, projected'}</small><b class="num" style="color:${saved >= k.target ? 'var(--ok)' : 'var(--warn)'}">${rp(saved)}</b>${prevSaved !== null && prevSaved ? arrow((saved - prevSaved) / Math.abs(prevSaved), false) : ''}</div>
      <div><small>Target hit</small><b class="num">${hit === null ? '–' : pct(hit)}</b><span class="tiny mute">of ${rp(k.target)}${k.customTarget ? ' (your own)' : ''}</span></div>
      <div><small>Savings rate</small><b class="num">${inc ? pct(saved / inc) : '–'}</b></div>
      <div><small>Transactions</small><b class="num">${k.exp.length}</b><span class="tiny mute">avg ${rp(shown ? k.spent / shown : 0)} a day</span></div>
    </div>
    <div class="row" style="margin-top:12px"><button class="btn sm aibtn" data-act="ask-month" data-id="${esc(c.id)}">${ic('ai', 16)}Ask AI to explain this month</button><button class="btn sm ghost" data-act="basics">Edit this month's target</button></div>
  </section>
  <div class="grid two" style="margin-top:14px">
    <div class="col">
      <section class="card"><div class="card-h"><div><h2>Highlights</h2><p>Worked out from your numbers</p></div></div>
        ${H.length ? `<ul class="hl">${H.map(h => `<li>${h}</li>`).join('')}</ul>` : '<div class="empty">Log a few days of spending to see highlights.</div>'}</section>
      <section class="card"><div class="card-h"><div><h2>Spending per day</h2><p>Green is everything, purple is the food part</p></div></div>${k.exp.length ? chart : '<div class="empty">No spending yet.</div>'}</section>
      <section class="card"><div class="card-h"><div><h2>Plan vs actual</h2><p>Every category, biggest spender first</p></div></div>${mix}<div style="margin-top:8px">${catRows || '<div class="empty">No categories yet.</div>'}</div></section>
    </div>
    <div class="col">
      <section class="card"><div class="card-h"><div><h2>Biggest transactions</h2></div></div>${topTx.map(e => `<div class="li tap" data-act="edit" data-id="${esc(e.id)}"><span class="dot" style="background:${colorOf(e.category)}"></span><div class="main"><b>${esc(e.item)}</b><span>${esc(e.category)}, ${fdw(e.date)}</span></div><div class="amt num">${rp(e.amount)}</div></div>`).join('') || '<div class="empty">None yet.</div>'}</section>
      <section class="card"><div class="card-h"><div><h2>Most frequent</h2><p>Bought more than once this month</p></div></div>${freq.map(m => li(esc(m.item), `${m.n} times, ${esc(m.cat)}`, rp(m.total))).join('') || '<div class="empty">No repeats yet.</div>'}</section>
      <section class="card"><div class="card-h"><div><h2>By weekday</h2><p>Average spending per day</p></div></div>
        <div class="strip" style="height:80px;gap:8px">${[1,2,3,4,5,6,0].map(i => `<div title="${WD[i]}: ${rp(wa[i])}"><i style="height:${Math.max(3, wa[i] / wmax * 60)}px;background:${i === wtop && wa[i] ? 'var(--gold)' : 'var(--brand-soft)'}"></i><small class="tiny mute" style="text-align:center;margin-top:4px">${WD[i]}</small></div>`).join('')}</div></section>
      <section class="card"><div class="card-h"><div><h2>By account</h2></div></div>${accs.map(([a, v]) => `<div style="padding:6px 0"><div class="between small"><b>${esc(a)}</b><span class="num">${rp(v)}</span></div><div class="bar" style="margin-top:4px"><i style="width:${v / accMax * 100}%;background:var(--brand)"></i></div></div>`).join('') || '<div class="empty">No spending yet.</div>'}</section>
      <section class="card"><div class="card-h"><div><h2>Income and bills</h2></div></div>
        ${k.incomes.map(e => li(esc(e.item), `${fdw(e.date)}, ${e.category === 'Income' ? 'to savings' : 'tops up ' + esc(e.category)}`, '+' + rp(e.amount), 'var(--ok)')).join('')}
        ${li('Salary', fd(c.start, { day: 'numeric', month: 'long' }), rp(k.income))}
        ${bills.length ? li('Bills', `${bills.filter(x => x.paid).length} of ${bills.length} paid`, `${rp(billsPaid)} of ${rp(k.billsTotal)}`) : ''}
        ${k.saved ? li('Moved to savings', 'this month', rp(k.saved), 'var(--brand)') : ''}</section>
    </div>
  </div>`;
}

/* ---------- AI: one screen, two modes ---------- */
const aiHead = mode => `<div class="ph"><div class="aihead"><div class="between"><h2 style="display:flex;align-items:center;gap:8px"><span style="color:var(--brand)">${ic('ai', 22)}</span>Budget AI</h2><button class="xbtn" data-act="close" aria-label="Close">${ic('x', 18)}</button></div>
  <div class="seg"><button data-act="ai-mode" data-v="log" class="${mode === 'log' ? 'on' : ''}">Log spending</button><button data-act="ai-mode" data-v="ask" class="${mode === 'ask' ? 'on' : ''}">Ask AI</button></div></div></div>`;
const ASK2 = ['Explain my spending this month', 'Where can I cut spending?', 'Am I on track for my savings target?', 'Plan the rest of this cycle for me', 'How did this month compare with last month?'];
function sheetAsk(sh) {
  const c = S.cycles.find(x => x.id === sh.cycleId) || curCycle();
  const msgs = S.askMsgs || (S.askMsgs = []);
  return `${aiHead('ask')}
    <p class="small mute" style="margin:-4px 0 10px">Answers use your real numbers from the ${fd(c.start, { month: 'long' })} cycle${c.id !== curCycle().id ? '' : ' (current)'}.</p>
    <div class="chat" id="chat">
      <div class="bubble ai"><p>Ask me anything about your money. I only use the numbers in your budget.</p>
        <div class="chips" style="flex-wrap:wrap;margin-top:8px">${ASK2.map((q, i) => `<button class="chip" data-act="ask-q" data-i="${i}" style="white-space:normal;text-align:left">${q}</button>`).join('')}</div></div>
      ${msgs.map(m => `<div class="bubble ${m.role === 'me' ? 'me' : 'ai'}">${m.role === 'me' ? esc(m.text) : `<p style="white-space:pre-wrap">${esc(m.text)}</p>`}</div>`).join('')}
      ${sh.busy ? '<div class="bubble ai"><p class="mute">Thinking…</p></div>' : ''}
    </div>
    <div class="composer"><div class="send"><textarea id="ask-in" rows="2" placeholder="Ask about your money">${esc(sh.draft || '')}</textarea><button class="btn" data-act="ask-go" ${sh.busy ? 'disabled' : ''}>${sh.busy ? '…' : 'Ask'}</button></div></div>`;
}
async function askSend(q) {
  const sh = S.sheet; q = (q || '').trim(); if (!q || !sh || sh.busy) return;
  const c = S.cycles.find(x => x.id === sh.cycleId) || curCycle();
  const hist = (S.askMsgs || []).slice(-4).map(m => `${m.role === 'me' ? 'Q' : 'A'}: ${m.text}`).join('\n');
  S.askMsgs.push({ role: 'me', text: q }); sh.busy = true; sh.draft = ''; renderSheet();
  let ans;
  try { ans = (await api('ai_ask', { question: hist ? `Earlier in this chat:\n${hist}\n\nNow: ${q}` : q, summary: aiSummary(c) }, 45000)).answer; }
  catch (e) { ans = e.auth ? 'Please sign in again to use the AI.' : e.server ? 'The AI could not answer: ' + e.message : 'You seem to be offline. Try again when you have signal.'; }
  if (!S.sheet || S.sheet.kind !== 'ask') { S.askMsgs.push({ role: 'ai', text: ans }); return; }
  S.askMsgs.push({ role: 'ai', text: ans }); sh.busy = false; renderSheet();
}
function sheetCount() {
  const parts = moneyParts();
  return `${sheetHead('Cycle count', 'Type what each account really shows right now.')}
    ${parts.count.replace('<h2>Cycle count</h2>', '').replace('<section class="card" id="count-card">', '<div id="count-card">').replace(/<\/section>\s*$/, '</div>')}
    <div style="margin-top:14px">${parts.hist.replace('<section class="card">', '<div>').replace('</section>', '</div>')}</div>`;
}
</script><script>
/* ---------- toast ---------- */
let toastTimer, toastUndo = null;
function toast(msg, undo) {
  const t = $('#toast'); toastUndo = undo || null;
  t.innerHTML = esc(msg) + (undo ? ` <button data-act="undo">Undo</button>` : '');
  t.classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove('show'); toastUndo = null; }, undo ? 5000 : 2800);
}

/* ---------- actions ---------- */
const entry = (o) => Object.assign({ id: uid('e'), date: today(), item: '', category: 'Others', amount: 0, account: '', createdAt: new Date().toISOString(), type: 'expense' }, o);
function findBill(id) { for (const c of S.cycles) { const b = (c.bills || []).find(x => x.id === id); if (b) return { c, b }; } return null; }
const clone = o => JSON.parse(JSON.stringify(o));
let busy = false;   // stops double taps creating duplicates

const ACT = {
  tab: d => { S.tab = d.tab; if (d.tab === 'log' || d.tab === 'calendar') S.hist = d.tab; if (['savings', 'recap', 'health'].includes(d.tab)) S.rep = d.tab; store.set('bi.tab', S.tab); if (S.tab !== 'budget') S.viewId = null; render(); window.scrollTo({ top: 0 }); },

  },
  'qa-chip': d => { const f = frequent()[+d.i], ta = $('#ai-in'); if (!f || !ta) return;
    ta.value = ta.value.trim().replace(/,$/, '') + (ta.value.trim() ? ', ' : '') + `${f.item} ${short(f.amount)}`; S.sheet.draftText = ta.value; ta.focus(); },
  'qa-date': d => { S.sheet.draftText = ($('#ai-in') || {}).value || ''; S.sheet.date = d.d; renderSheet(); },
  'ai-example': () => { const ta = $('#ai-in'); ta.value = EXAMPLE_NOTE; S.sheet.draftText = ta.value; ta.focus(); },
  'ai-send': () => aiSend(($('#ai-in') || {}).value),
  'ai-no': d => { const m = S.sheet.msgs[+d.m]; if (!m) return; m.editing = true;

  'ai-discard': d => { const m = S.sheet.msgs[+d.m]; if (m) { m.status = 'discarded'; renderChat(); } },
  'qa-rm': d => { const m = S.sheet.msgs[+d.m]; if (!m) return; m.items.splice(+d.i, 1); if (!m.items.length) m.status = 'discarded'; renderChat(); },
  'ai-yes': d => {
    const m = S.sheet.msgs[+d.m]; if (!m || m.status !== 'pending') return;
    const rows = m.items.filter(r => r.amount > 0); if (!rows.length) return;
    rows.forEach(r => r.noteSnap = billNote(r));

    const ops = [{ action: 'add', expenses: list }];
    // Payments matched to a bill count toward it; the bill flips to Paid once fully covered.
    const withBill = rows.map((r, i) => [r, list[i]]).filter(([r]) => r.billId);
    if (withBill.length) {
      const c = clone(curCycle());
      withBill.forEach(([r, e]) => { const b = (c.bills || []).find(x => x.id === r.billId); if (!b) return;
        b.paidAmount = (b.paidAmount || 0) + r.amount; b.expenseIds = (b.expenseIds || []).concat(e.id);

    if (S.sheet.account) store.set('bi.lastAcc', S.sheet.account);
    m.status = 'saved'; commit(...ops);
    const k = calc(curCycle()), spentToday = sumE(S.expenses.filter(e => e.date === today() && e.type === 'expense'));
    S.sheet.msgs.push({ role: 'ai', tone: 'good', html: `Saved ${list.length} item${list.length > 1 ? 's' : ''}. Today so far: <b>${rp(spentToday)}</b>.${k.daysLeft && k.flexBudget ? ` Safe to spend for the rest of today: <b>${rp(k.safeToday)}</b>.` : ''}` });
    renderChat(); toast('Saved', () => commit(...list.map(e => ({ action: 'delete', id: e.id }))));
  },
  edit: d => openSheet('edit', { id: d.id }),
  'e-type': d => { S.sheet.vals = { item: $('#e-item').value, amount: parseMoney($('#e-amt').value), date: $('#e-date').value, account: $('#e-acc').value,

    S.sheet.type = d.v; renderSheet(); },
  'e-save': () => {
    const e = S.expenses.find(x => x.id === S.sheet.id); if (!e) return closeSheet();
    const type = S.sheet.type || e.type;
    const patch = { item: $('#e-item').value.trim() || e.item, amount: parseMoney($('#e-amt').value) || e.amount, date: $('#e-date').value || e.date,
      category: type === 'save' ? 'Savings' : $('#e-cat').value, account: $('#e-acc').value, type };
    closeSheet(); commit({ action: 'update', id: e.id, patch }); toast('Entry updated');
  },
  'e-del': () => {
    const e = S.expenses.find(x => x.id === S.sheet.id); if (!e) return closeSheet();
    const copy = clone(e), ops = [{ action: 'delete', id: e.id }];
    const hit = S.cycles.find(c => (c.bills || []).some(b => (b.expenseIds || []).includes(e.id) || b.expenseId === e.id));
    if (hit) { const c = clone(hit), b = c.bills.find(b => (b.expenseIds || []).includes(e.id) || b.expenseId === e.id);
      b.expenseIds = (b.expenseIds || []).filter(x => x !== e.id); if (b.expenseId === e.id) b.expenseId = '';
      b.paidAmount = Math.max(0, (b.paidAmount || 0) - e.amount); b.paid = b.paidAmount >= b.amount && b.amount > 0; ops.push({ action: 'saveCycle', cycle: c }); }

  cyc: d => { const b = bounds(viewCycle()), c = +d.d < 0 ? b.prev : b.next; if (c) { S.viewId = c.id; S.open = {}; render(); } },

  },
  'bill-pay': d => {

  'bill-unpay': d => {

    openSheet('explain', { title: 'How the cycle count works', html: `
      <p>The app expects your counted accounts to hold:</p>
      <table class="table"><tbody>
        <tr><td>Carried over</td><td class="num">${rp(k.c.carry)}</td></tr><tr><td>Salary</td><td class="num">+ ${rp(k.income)}</td></tr>
        <tr><td>Other money in</td><td class="num">+ ${rp(k.extra)}</td></tr><tr><td>Spent this cycle</td><td class="num">− ${rp(k.spent)}</td></tr>
        <tr><td>Moved to savings</td><td class="num">− ${rp(k.saved)}</td></tr><tr><td><b>Expected</b></td><td class="num"><b>${rp(k.shouldHave)}</b></td></tr></tbody></table>
      <p>Moving money between your own accounts (BCA to Gopay, say) changes nothing, because only the total is compared. If the total is off, it's almost always an expense you forgot to log.</p>` }); },
  settings: () => openSheet('settings', { draft: clone({ name: S.settings.name, accounts: S.settings.accounts }) }),
  'acc-add': () => { S.sheet.draft.accounts.push({ name: '', count: true }); renderSheet(); },
  'acc-rm': d => { S.sheet.draft.accounts.splice(+d.i, 1); renderSheet(); },
  'settings-save': () => {
    const s = clone(S.settings), d = S.sheet.draft;
    s.name = $('#st-name').value.trim() || s.name; s.accounts = d.accounts.filter(a => a.name.trim()).map(a => ({ name: a.name.trim(), count: !!a.count }));
    closeSheet(); commit({ action: 'saveSettings', settings: s }); toast('Settings saved');
  },
  'sync-now': () => { pull(); toast('Syncing…'); },
  export: () => {
    const cell = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const rows = [['id', 'date', 'item', 'category', 'amount', 'account', 'type', 'createdAt']].concat(
      S.expenses.slice().sort((a, b) => a.date.localeCompare(b.date)).map(e => [e.id, e.date, e.item, e.category, e.amount, e.account, e.type, e.createdAt]));
    const blob = new Blob([rows.map(r => r.map(cell).join(',')).join('\n')], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `budget-in-${today()}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  signout: () => signOut(''),
  'theme-toggle': () => { applyTheme(isDark() ? 'light' : 'dark'); render(); },
  'theme-set': (d, el) => { applyTheme(d.v); el.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); render(); },
  'income-new': d => openSheet('income', { date: d.d && d.d <= today() ? d.d : today(), item: '' }),
  'inc-kind': (d, el) => { $('#i-item').value = d.v; el.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el)); },
  'income-save': () => {
    const amount = parseMoney($('#i-amt').value), item = $('#i-item').value.trim() || 'Income', date = $('#i-date').value || today();
    if (!amount) return toast('Enter the amount');
    const use = $('#i-use').value, account = $('#i-acc').value;
    const e = entry({ item, amount, category: use, account, date, type: 'income' });
    if (account) store.set('bi.lastAcc', account);
    closeSheet(); commit({ action: 'add', expenses: [e] });
    toast(use === 'Income' ? `${rp(amount)} added. Your projected savings went up.` : `${rp(amount)} added to your ${use} budget`, () => commit({ action: 'delete', id: e.id }));
  },
  basics: () => { if (S.tab === 'recap' && S.recapId) S.viewId = S.recapId; openSheet('basics'); },
  ai: () => ACT.add(),
  'ai-mode': d => d.v === 'ask' ? openSheet('ask', { cycleId: curCycle().id }) : ACT.add(),
  'ask-q': d => askSend(ASK2[+d.i]),
  'ask-go': () => askSend(($('#ask-in') || {}).value),
  'ask-month': d => { openSheet('ask', { cycleId: d.id }); askSend('Explain my spending this month: what went well, what went over, and what I should change next month.'); },
  count: () => openSheet('count'),
  'open-recap': d => { S.recapId = d.id; S.tab = 'recap'; S.rep = 'recap'; render(); window.scrollTo({ top: 0 }); },
  rcyc: d => { const c = S.cycles.find(x => x.id === S.recapId) || curCycle(), b = bounds(c), n = +d.d < 0 ? b.prev : b.next; if (n) { S.recapId = n.id; render(); } },
  'basics-save': () => {
    const c = clone(viewCycle()), start = $('#bx-start').value, payday = $('#bx-pay').value;
    if (!start || !payday || payday <= start) return toast('Next payday must be after the start date');
    if (S.cycles.some(x => x.id !== c.id && x.start === start)) return toast('Another cycle already starts on that day');
    Object.assign(c, { start, payday, income: parseMoney($('#bx-inc').value), carry: parseMoney($('#bx-carry').value) });
    const st = parseMoney($('#bx-st').value); if (st > 0) c.savingsTarget = st; else delete c.savingsTarget;
    closeSheet(); commit({ action: 'saveCycle', cycle: c }); toast('Saved');
  },
  'line-edit': d => openSheet('line', { name: d.name }),
  'line-save': d => {
    const c = clone(viewCycle()), l = c.lines.find(x => x.name === d.name); if (!l) return closeSheet();
    if ($('#ln-qty')) { l.qty = Number($('#ln-qty').value) || 0; l.unit = parseMoney($('#ln-unit').value); }
    l.kind = $('#ln-kind').value; l.group = $('#ln-group').value; l.track = $('#ln-track').value;
    closeSheet(); commit({ action: 'saveCycle', cycle: c }); toast(`${l.name} updated`);
  },
  'cal-day': d => { S.calSel = d.d; render(); if (window.innerWidth < 960) { const c = document.querySelectorAll('.tabpage .card')[2]; if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); } },
  'cal-nav': d => { const [y, m] = S.calMonth.split('-').map(Number), x = new Date(y, m - 1 + Number(d.d), 1); S.calMonth = `${x.getFullYear()}-${pad(x.getMonth() + 1)}`; render(); },
  'cal-today': () => { S.calMonth = today().slice(0, 7); S.calSel = today(); render(); },
  'cal-add': () => openSheet('add', { msgs: [], date: S.calSel || today(), account: store.get('bi.lastAcc', ''), draftText: '' }),
  'signin-again': () => { silentRefresh().then(() => pull()).catch(() => { AUTH = null; store.set('bi.auth', null); S.authMsg = 'Please sign in again.'; render(); }); },
  'setup-save': () => {
    const start = $('#su-start').value, payday = $('#su-pay').value;
    if (!start || !payday || payday <= start) return toast('Next payday must be after your last payday');
    const s = clone(S.settings); s.name = $('#su-name').value.trim() || s.name;
    const c = newCycle(start, payday, parseMoney($('#su-inc').value), 0, emptyLines(), []);
    S.tab = 'budget'; store.set('bi.tab', 'budget');
    commit({ action: 'saveSettings', settings: s }, { action: 'saveCycle', cycle: c });
    ACT.plan();
  },
  ask: async d => {
    const q = d.i !== undefined ? ASK[+d.i] : ($('#ask-in') || {}).value; if (!q || !q.trim()) return;
    S.askOut = 'Thinking…'; const out = $('#ask-out'); if (out) out.textContent = S.askOut;
    try { const r = await api('ai_ask', { question: q, summary: aiSummary() }, 45000); S.askOut = `Q: ${q}\n\n${r.answer}`; }
    catch (e) { S.askOut = e.auth ? 'Please sign in again to use the AI.' : e.server ? 'The AI could not answer: ' + e.message : 'You seem to be offline. Try again when you have signal.'; }
    const o2 = $('#ask-out'); if (o2) o2.textContent = S.askOut;
  },
  retry: () => pull()
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  ev.preventDefault(); fn(el.dataset, el);
});
$('#sheet').addEventListener('click', ev => { if (ev.target.id === 'sheet') closeSheet(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && S.sheet) closeSheet(); });

/* ---------- typing ---------- */
function onField(ev) {
  const t = ev.target, ds = t.dataset, sh = S.sheet;
  if (t.id === 'ai-in') { sh.draftText = t.value; return; }
  if (t.id === 'ask-in') { sh.draft = t.value; return; }
  if (t.id === 'qa-acc') { sh.account = t.value; return; }
  if (ds.qf) {
    const row = t.closest('.prow'), m = sh.msgs[+row.dataset.m], it = m && m.items[+row.dataset.i]; if (!it) return;
    it[ds.qf] = ds.qf === 'amount' ? parseMoney(t.value) : t.value;
    return;
  }
  if (ds.count !== undefined) { const d = store.get('bi.countDraft', {}); d[ds.count] = t.value; store.set('bi.countDraft', d); return updateCountResult(); }
  if (ds.pf || ds.lf || ds.bf) {
    const d = sh.draft, money = t.classList.contains('money');
    const val = t.type === 'checkbox' ? t.checked : money ? parseMoney(t.value) : (ds.lf === 'qty' ? Number(t.value) || 0 : t.value);
    if (ds.pf) d[ds.pf] = val;
    if (ds.lf) { d.lines[+ds.i][ds.lf] = val; const el = $(`[data-lt="${ds.i}"]`); if (el) el.textContent = '= ' + rp(lineTotal(d.lines[+ds.i], d)); }
    if (ds.bf) d.bills[+ds.i][ds.bf] = val;
    const total = sumA(d.lines.map(l => lineTotal(l, d))); $('#plan-tot').innerHTML = planTot(total, (Number(d.income) || 0) - total, d);
    return;
  }
  if (t.id === 'log-q') { S.log.q = t.value; S.logLimit = 0; return refreshLog(); }
  if (t.id === 'log-period' || t.id === 'log-cat') { S.log[t.id === 'log-period' ? 'period' : 'cat'] = t.value; S.logLimit = 0; return refreshLog(); }
  if (ds.af) { const a = sh.draft.accounts[+ds.i]; a[ds.af] = t.type === 'checkbox' ? t.checked : t.value; }
  if ((t.id === 'ln-qty' || t.id === 'ln-unit') && $('#ln-tot')) $('#ln-tot').textContent = 'Total ' + rp((Number($('#ln-qty').value) || 0) * parseMoney($('#ln-unit').value));
}
document.addEventListener('input', onField);
document.addEventListener('change', ev => { if (ev.target.type === 'checkbox' || ev.target.tagName === 'SELECT' || ev.target.type === 'date') onField(ev); });
document.addEventListener('focusout', ev => { const t = ev.target; if (t.classList && t.classList.contains('money') && t.value.trim()) { t.value = mval(parseMoney(t.value)) || '0'; } });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && !ev.shiftKey && ev.target.id === 'ai-in') { ev.preventDefault(); ACT['ai-send'](); }
  if (ev.key === 'Enter' && !ev.shiftKey && ev.target.id === 'ask-in') { ev.preventDefault(); ACT['ask-go'](); }
});

/* ---------- Sign in with Google ---------- */
let gisReady = false, authWaiters = [];
const jwtPayload = t => JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')))));
function gisInit() {
  if (gisReady || !CONFIGURED || !(window.google && google.accounts && google.accounts.id)) return;
  google.accounts.id.initialize({ client_id: APP.clientId, callback: onCredential, auto_select: true,
    cancel_on_tap_outside: false, use_fedcm_for_prompt: true, itp_support: true });
  gisReady = true;
  if (!AUTH) { renderGoogleButton(); google.accounts.id.prompt(); }
}
function renderGoogleButton() {
  const el = $('#gbtn'); if (!el || !gisReady) return;
  google.accounts.id.renderButton(el, { theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', width: 280 });
}
function onCredential(resp) {
  let pl; try { pl = jwtPayload(resp.credential); } catch (e) { return; }
  const first = !AUTH;
  AUTH = { token: resp.credential, exp: pl.exp * 1000, email: pl.email, name: pl.given_name || pl.name || '', picture: pl.picture || '' };
  store.set('bi.auth', AUTH); S.authMsg = '';
  const w = authWaiters; authWaiters = []; w.forEach(f => f.res(AUTH.token));
  if (first) { render(); pull(); } else if (S.sync === 'signin') { setSync('idle'); flush().then(pull); }
}
/* Google ID tokens last 1 hour. This asks Google for a new one without a click when possible. */
function silentRefresh() {
  return new Promise((res, rej) => {
    gisInit(); if (!gisReady) return rej(authErr());
    authWaiters.push({ res, rej });
    try { google.accounts.id.prompt(); } catch (e) {}
    setTimeout(() => { const i = authWaiters.findIndex(f => f.res === res); if (i >= 0) { authWaiters.splice(i, 1); rej(authErr()); } }, 12000);
  });
}
function signOut(msg) {
  if (S.outbox.length && !msg && !confirm(`${S.outbox.length} change(s) haven't reached your sheet yet and will be lost. Sign out anyway?`)) return;
  try { if (gisReady) google.accounts.id.disableAutoSelect(); } catch (e) {}
  AUTH = null; ['bi.auth', 'bi.cache', 'bi.outbox', 'bi.countDraft'].forEach(k => store.del(k));
  Object.assign(S, { expenses: [], cycles: [], counts: [], settings: null, outbox: [], loaded: false, authMsg: msg || '', sync: 'idle' });
  closeSheet(); render();
}


/* ---------- start ---------- */
(function init() {
  const cache = store.get('bi.cache', null);
  if (cache) { S.expenses = (cache.expenses || []).map(normExp); S.cycles = cache.cycles || []; S.counts = cache.counts || []; S.settings = cache.settings; }
  render();
  if (AUTH) pull();
  setInterval(() => { if (document.visibilityState === 'visible' && !S.sheet) pull(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); });
  window.addEventListener('online', () => pull());
  let day = today(); setInterval(() => { if (today() !== day) { day = today(); safeRender(); } }, 60000);
})();
</script>
<script src="https://accounts.google.com/gsi/client" async onload="gisInit()"></script>
</body>
