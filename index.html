<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17614F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Budget.in</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Budget.in">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --sunk:#E4EAE6; --ink:#132235; --ink2:#34465A; --mute:#5F6F80; --line:#D3DDD8;
  --brand:#17614F; --brand-ink:#FFFFFF; --brand-soft:#D6EAE2;
  --hero:#17614F; --hero-ink:#F3F8F5; --hero-mute:#B9D6CB;
  --gold:#F2B705; --gold-ink:#3A2A00; --gold-soft:#FFF0C0;
  --ok:#1E7F55; --ok-soft:#DCF0E5; --warn:#975F00; --warn-soft:#FBEAC2; --bad:#B9362D; --bad-soft:#F7DCD9;
  --display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav-h:66px; --food:#7B4BC4; --food-soft:#ECE3FA;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0D151E; --surface:#15202B; --sunk:#1C2936; --ink:#E6EEF2; --ink2:#C2CFD8; --mute:#8FA2B3; --line:#263645;
    --brand:#46B892; --brand-ink:#062019; --brand-soft:#173830;
    --hero:#123F35; --hero-ink:#EEF7F2; --hero-mute:#93BCAE;
    --gold:#F5C842; --gold-ink:#2C2000; --gold-soft:#3A3013;
    --ok:#4CC38D; --ok-soft:#14322A; --warn:#E6AE45; --warn-soft:#3A2C12; --bad:#F07A72; --bad-soft:#3C1E1D;
    --food:#B996F2; --food-soft:#2C2240;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0;width:100%;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
textarea{resize:vertical;min-height:76px;line-height:1.45}
label.f{display:block;font-size:13px;color:var(--mute);font-weight:600;margin:0 0 5px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.015em;margin:0;line-height:1.15}
h2{font-size:20px} h3{font-size:16px}
p{margin:0}
.mute{color:var(--mute)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack>*+*{margin-top:12px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.shell{max-width:1180px;margin:0 auto;padding:0 0 calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px))}
.side{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 10px}
.top h1{font-size:24px}
.top .date{font-size:13px;color:var(--mute)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mute);padding:6px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.sync.saving i{background:var(--gold)} .sync.offline i,.sync.error i{background:var(--bad)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.tabpage{padding:0 14px}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.grid>*,.col{min-width:0}
.col{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.card.flat{background:transparent;border-style:dashed}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.card-h p{font-size:13px;color:var(--mute);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:700;background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.link{color:var(--brand);font-weight:700;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--sunk);color:var(--ink2)}
.pill.ok,.pill.paid{background:var(--ok-soft);color:var(--ok)}
.pill.watch,.pill.due{background:var(--warn-soft);color:var(--warn)}
.pill.over,.pill.unplanned{background:var(--bad-soft);color:var(--bad)}
.pill.off{background:transparent;color:var(--mute);border:1px dashed var(--line)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.bar{height:8px;border-radius:8px;background:var(--sunk);overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:8px;transition:width .35s}
.bar>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45;border-radius:2px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kv>div{background:var(--sunk);border-radius:14px;padding:10px 12px;min-width:0}
.kv small{display:block;font-size:12px;color:var(--mute);font-weight:600}
.kv b{font-family:var(--display);font-size:18px;font-weight:800;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:18px;text-align:center;color:var(--mute);font-size:14px}

/* ---------- hero (the one loud thing) ---------- */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:18px 18px 16px;position:relative;overflow:hidden}
.hero .lbl{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--hero-mute);font-weight:600}
.hero .big{font-family:var(--display);font-weight:800;font-size:clamp(44px,13vw,64px);line-height:1;letter-spacing:-.03em;margin:8px 0 6px}
.hero .big.neg{color:#FFB4A8}
.hero .sub{font-size:14px;color:var(--hero-mute)}
.hero .sub b{color:var(--hero-ink)}
.ruler{margin-top:16px}
.ruler svg{width:100%;height:38px;display:block}
.ruler .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--hero-mute);margin-top:4px}
.ruler .ends b{color:var(--gold)}
.hero .q{width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;color:var(--hero-ink);font-weight:700;font-size:13px}

/* ---------- lists ---------- */
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .main{flex:1;min-width:0}
.li .main b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .main span{font-size:12px;color:var(--mute)}
.li .amt{font-weight:700;text-align:right}
.li .amt.in{color:var(--ok)}
.li.tap{cursor:pointer}
.tagdot{display:inline-flex;align-items:center;gap:5px}

/* category rows */
.cat{padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.cat:first-child{border-top:0}
.cat .t{display:flex;align-items:center;gap:10px}
.cat .t .n{flex:1;min-width:0}
.cat .t .n b{font-weight:700}
.cat .t .n span{display:block;font-size:12px;color:var(--mute)}
.cat .t .r{text-align:right;font-size:13px}
.cat .t .r b{display:block;font-size:15px}
.cat .bar{margin-top:8px}
.cat .drill{margin-top:8px;background:var(--sunk);border-radius:12px;padding:4px 12px}
.cat .drill .li{border-color:var(--line)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{color:var(--mute);font-weight:600}
.chip.on small{color:inherit;opacity:.75}

/* nudges */
.nudge{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--gold-soft)}
.nudge+.nudge{margin-top:8px}
.nudge .ic{font-size:20px;line-height:1.2}
.nudge p{font-size:14px;color:var(--ink)}
.nudge .act{margin-top:8px}
.nudge.good{background:var(--ok-soft)} .nudge.bad{background:var(--bad-soft)}

/* charts */
.strip{display:flex;gap:2px;align-items:flex-end;height:84px;margin-top:10px}
.strip>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.strip i{display:block;border-radius:3px 3px 1px 1px;background:var(--sunk)}
.strip i.ok{background:var(--ok)} .strip i.bad{background:var(--bad)} .strip i.fut{background:transparent;border:1px dashed var(--line)} .strip i.today{outline:2px solid var(--ink);outline-offset:1px}
.strip-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:4px}
.mix{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--sunk)}
.mix i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.score{display:flex;gap:16px;align-items:center}
.score svg{flex:none}
.comp{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.comp:first-of-type{border-top:0}
.comp .bar{grid-column:1/-1}
.comp p{grid-column:1/-1;font-size:13px;color:var(--mute)}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:right;font-weight:600;color:var(--mute);padding:6px 4px;border-bottom:1px solid var(--line)}
.table th:first-child,.table td:first-child{text-align:left}
.table td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line)}
.scrollx{overflow-x:auto}

/* cycle switcher */
.cyc{display:flex;align-items:center;gap:8px;justify-content:space-between;margin:2px 0 12px}
.cyc .t{text-align:center;flex:1}
.cyc .t b{font-family:var(--display);font-size:18px;display:block}

/* forms */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg .full{grid-column:1/-1}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.prow{border:1px solid var(--line);border-radius:16px;padding:10px;background:var(--surface)}
.prow+.prow{margin-top:8px}
.prow .g{display:grid;grid-template-columns:1fr 128px;gap:8px}
.prow .g2{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:8px}
.prow input,.prow select{padding:9px 10px;font-size:15px}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
.xbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--mute);background:var(--sunk)}
.lrow{display:grid;grid-template-columns:1fr 64px 110px 36px;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lrow input,.lrow select{padding:8px 9px;font-size:14px}
.lrow .meta{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.lrow .tot{grid-column:1/-1;font-size:12px;color:var(--mute)}
.acc{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.acc:first-child{border-top:0}
.acc span{font-weight:600}
.acc small{display:block;color:var(--mute);font-size:12px;font-weight:500}
.result{margin-top:12px;border-radius:16px;padding:14px;background:var(--sunk)}
.result.ok{background:var(--ok-soft)} .result.bad{background:var(--bad-soft)}
.result .big2{font-family:var(--display);font-weight:800;font-size:26px}


/* ---------- AI chat ---------- */
.chat{display:flex;flex-direction:column;gap:10px;min-height:120px;padding-bottom:6px}
.bubble{max-width:92%;padding:12px 14px;border-radius:18px;font-size:15px;line-height:1.45}
.bubble.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.bubble.ai.good{background:var(--ok-soft);border-color:transparent}
.bubble.ai.done{opacity:.6}
.bubble.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:6px}
.plist{margin-top:10px;border-top:1px solid var(--line)}
.pi{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.pi>div{min-width:0}
.pi b{font-weight:700}
.pi span{display:block;font-size:12px;color:var(--mute)}
.pi .in{color:var(--ok)}
.pi.tot{border-bottom:0;font-weight:700}
.bubble .prow{margin-top:8px}
.composer{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--bg);padding:10px 0 6px;margin-top:8px;border-top:1px solid var(--line)}
.send{display:flex;gap:8px;align-items:flex-end}
.send textarea{min-height:48px;flex:1}
.send .btn{flex:none}
code{background:var(--sunk);padding:1px 5px;border-radius:5px;font-size:.92em}

/* ---------- bottom tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mute);padding:8px 2px;border-radius:12px;min-width:0}
.tabbar button.on{color:var(--brand)}
.tabbar button.on svg{background:var(--brand-soft);border-radius:10px;padding:2px 10px;box-sizing:content-box}
.tabbar svg,.side svg{width:22px;height:22px}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));z-index:21;width:60px;height:60px;border-radius:20px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.22)}
.fab:active{transform:scale(.95)}

/* editable tiles */
button.tile{display:block;text-align:left;background:var(--sunk);border-radius:14px;padding:10px 12px;min-width:0;border:1px solid transparent}
button.tile small{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mute);font-weight:600}
button.tile b{font-family:var(--display);font-size:18px;font-weight:800;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.tile:hover,button.tile:focus-visible{border-color:var(--brand)}

/* calendar */
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cdow{text-align:center;font-size:11px;font-weight:700;color:var(--mute);padding-bottom:2px}
.cd{display:flex;flex-direction:column;align-items:stretch;gap:1px;min-height:68px;padding:5px 4px 5px;border-radius:10px;background:var(--sunk);text-align:left;border:1.5px solid transparent;min-width:0;overflow:hidden}
.cd .dn{font-size:12px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:3px}
.cd .ct{font-size:12px;font-weight:800;color:var(--ink);line-height:1.2;min-height:14px}
.cd .cf{font-size:11px;font-weight:700;color:var(--food);line-height:1.2;min-height:13px}
.cd .cf.over{color:var(--bad);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}
.cd .cb{margin-top:auto;height:5px;border-radius:3px;overflow:hidden;display:block}
.cd .cb i{display:block;height:100%;background:var(--ink2);opacity:.35;border-radius:3px;position:relative}
.cd .cb i b{position:absolute;inset:0 auto 0 0;background:var(--food);opacity:1;border-radius:3px}
.cd.fut{opacity:.45}
.cd.now{border-color:var(--ink)}
.cd.sel{background:var(--brand-soft);border-color:var(--brand)}
.pay{width:7px;height:7px;border-radius:50%;background:var(--gold);display:inline-block}
.cd .inc{font-style:normal;color:var(--ok);font-weight:800;font-size:12px}
.cd .cb i{opacity:1;background:color-mix(in srgb,var(--ink2) 35%,transparent)}
@media (min-width:960px){ .cd{min-height:84px;padding:7px} .cd .ct{font-size:14px} .cd .cf{font-size:13px} }

/* ---------- sheet / dialog ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,20,30,.45);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.panel .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;position:sticky;top:-18px;background:var(--bg);padding:6px 0;z-index:2}
.panel .foot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--bg);padding:12px 0 4px;margin-top:14px;display:flex;gap:8px}
.panel .foot .btn{flex:1}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1}
body.sheet-open .fab{display:none}
body.sheet-open #toast{top:calc(14px + env(safe-area-inset-top,0px));bottom:auto}
#toast button{color:var(--gold);font-weight:800;margin-left:10px;pointer-events:auto}

/* ---------- connect screen ---------- */
.connect{min-height:100vh;display:grid;grid-template-columns:minmax(0,420px);justify-content:center;align-content:center;padding:24px 16px}
.connect .card{width:100%;min-width:0}
.fg>*{min-width:0}
input[type=date],input[type=month]{min-width:0;max-width:100%}

/* ---------- desktop ---------- */
@media (min-width:960px){
  .shell{display:grid;grid-template-columns:220px 1fr;gap:28px;padding:24px 24px 48px}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:24px;align-self:start}
  .side .brand{font-family:var(--display);font-weight:800;font-size:24px;padding:4px 12px 16px}
  .side .brand span{color:var(--brand)}
.side .brand{display:flex;align-items:center;gap:10px}
.mark{display:block;flex:none}
  .side button.nav{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;font-weight:700;color:var(--ink2);text-align:left}
  .side button.nav.on{background:var(--surface);color:var(--brand);border:1px solid var(--line)}
  .side .btn{margin-top:12px}
  .tabbar,.fab{display:none}
  .top{padding:0 0 14px}
  .tabpage{padding:0}

<body>
<div id="root"></div>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
   Budget.in v2
   - Payday-to-payday cycles (not calendar months), each saved with its own plan,
     so history stays true even after you change budgets.
   - Offline-first: every change is applied on the phone first, queued, then sent
     to the Google Sheet. Bad signal never loses an entry.
   ===================================================================== */

/* ===== Paste your two values here (see the setup guide). Both are safe to publish. ===== */
const APP = {
  scriptUrl: 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL',
  clientId: 'PASTE_YOUR_CLIENT_ID.apps.googleusercontent.com'
};
const CONFIGURED = !/PASTE_/.test(APP.scriptUrl + APP.clientId);
const COOL_OFF_DAYS = 3;        // wishlist waiting period
const HOURS_PER_MONTH = 173;    // 40h x 4.33 weeks, for "hours of work"

/* ---------- storage ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let AUTH = store.get('bi.auth', null);   // {token, exp, email, name, picture} from Sign in with Google

const S = {
  expenses: [], cycles: [], counts: [], settings: null,
  outbox: store.get('bi.outbox', []),
  tab: store.get('bi.tab', 'today'), viewId: null, open: {},
  sync: 'idle', flushing: false, loaded: false, needsRender: false, authMsg: '', askOut: '',
  qa: null, sheet: null
};

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sumA = a => a.reduce((s, v) => s + (Number(v) || 0), 0);
const sumE = a => a.reduce((s, e) => s + (e.amount || 0), 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rp = n => { n = Math.round(n || 0); return (n < 0 ? '−' : '') + 'Rp' + Math.abs(n).toLocaleString('id-ID'); };
const short = n => { n = Math.round(n || 0); const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (a >= 1e6) return s + (a / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
  if (a >= 1e3) return s + Math.round(a / 1e3) + 'k'; return s + a; };
const pct = v => Math.round(v * 100) + '%';

const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const addMonths = (s, n) => { const d = pd(s), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); d.setDate(Math.min(day, dim(d.getFullYear(), d.getMonth()))); return ymd(d); };
const fd = (s, o = {day:'numeric', month:'short'}) => pd(s).toLocaleDateString('en-GB', o);
const fdw = s => fd(s, {weekday:'short', day:'numeric', month:'short'});

function toAmount(raw, suf) {
  suf = (suf || '').toLowerCase();
  if (['k', 'rb', 'ribu'].includes(suf)) return Math.round(parseFloat(String(raw).replace(',', '.')) * 1e3);
  if (['jt', 'juta'].includes(suf)) return Math.round(parseFloat(String(raw).replace(',', '.')) * 1e6);
  return Number(String(raw).replace(/[.,\s]/g, '')) || 0;
}
function parseMoney(v) {
  v = String(v ?? '').trim().toLowerCase().replace(/^rp\.?\s*/, '');
  const m = v.match(/^(\d+(?:[.,]\d+)*)\s*(k|rb|ribu|jt|juta)?$/);
  return m ? toAmount(m[1], m[2]) : (Number(v.replace(/\D/g, '')) || 0);
}
const mval = n => n ? Math.round(n).toLocaleString('id-ID') : '';

const PALETTE = ['#1F8A70','#D99A00','#D1495B','#3E7CB1','#8C5BB5','#E07A2E','#2A9D8F','#B5651D','#5C6BC0','#C2185B','#6D8B3A','#00838F','#9E7B00','#7B5E57','#607D8B'];
const colorOf = name => { let h = 0; for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };

/* ---------- data model ---------- */
/* Old names from the spreadsheet and the first prototype, mapped to the English names. */
const RENAME = { Makan:'Food', Jajan:'Snacks', Pokok:'Groceries', Bensin:'Fuel', Darurat:'Emergency', Parkir:'Parking',
  Rumah:'Housing', 'Lain-lain':'Others', 'Kuota+icloud':'Data & iCloud', 'Kuota+icloud+google':'Data & iCloud',
  Kos:'Boarding', Tagihan:'Bills', Listrik:'Electricity' };

const L = (name, qty, unit, kind, group, track = '') => ({ name, qty, unit, kind, group, track });
/* kind: flex = day-to-day spending (counts toward "safe to spend"), fixed = paid once, buffer = only if needed
   group: need / want / debt (for the 50/30/20 view)                       track: day | week */
function seedLines() {
  return [
    L('Food', 29, 35000, 'flex', 'need', 'day'),
    L('Snacks', 1, 400000, 'flex', 'want'),
    L('Groceries', 1, 230000, 'flex', 'need'),
    L('Fuel', 1, 100000, 'flex', 'need', 'week'),
    L('Parking', 1, 50000, 'flex', 'need'),
    L('Laundry', 1, 100000, 'flex', 'need'),
    L('Skincare', 0, 0, 'flex', 'want'),
    L('Others', 1, 50000, 'buffer', 'want'),
    L('Emergency', 1, 100000, 'buffer', 'need'),
    L('Boarding', 1, 650000, 'fixed', 'need'),
    L('Housing', 1, 500000, 'fixed', 'need'),
    L('Data & iCloud', 1, 70000, 'fixed', 'need'),
    L('Electricity', 0, 103000, 'fixed', 'need'),
    L('Admin', 0, 40000, 'fixed', 'need'),
    L('Bills', 1, 0, 'fixed', 'debt')
  ];
}
/* Same structure as your sheet, every amount at 0: you fill in your own numbers. */
const emptyLines = () => seedLines().map(l => Object.assign(l, { qty: 0, unit: 0 }));
function defaultAccounts() {
  return ['Mandiri', 'BCA', 'Superbank', 'Spay', 'Gopay / IOU', 'Cash'].map(n => ({ name: n, count: true }))
    .concat([{ name: 'Saving', count: false }]);
}
function defaultSettings(name, accounts) {
  return { v: 2, name: name || '', accounts: accounts || defaultAccounts(), goals: [], wishlist: [] };
}
function newCycle(start, payday, income, carry, lines, bills) {
  return { id: 'c' + start, start, payday, income: income || 0, carry: carry || 0, lines: lines || emptyLines(), bills: bills || [] };
}

function normExp(e) {
  return { id: String(e.id), date: String(e.date || '').slice(0, 10), item: String(e.item || ''),
    category: RENAME[e.category] || String(e.category || 'Others'), amount: Number(e.amount) || 0,
    account: String(e.account || ''), createdAt: String(e.createdAt || ''),
    type: ['income', 'save'].includes(e.type) ? e.type : 'expense' };
}

/* ---------- cycles ---------- */
const cyclesAsc = () => S.cycles.slice().sort((a, b) => a.start.localeCompare(b.start));
function bounds(c) {
  const asc = cyclesAsc(), i = asc.findIndex(x => x.id === c.id);
  return { from: c.start, to: asc[i + 1] ? asc[i + 1].start : null, prev: asc[i - 1] || null, next: asc[i + 1] || null };
}
function cycleFor(date) { let r = null; for (const c of cyclesAsc()) if (c.start <= date) r = c; return r; }
const curCycle = () => cycleFor(today()) || cyclesAsc()[0] || null;
const inRange = (e, b) => e.date >= b.from && (!b.to || e.date < b.to);
const lineTotal = (l, c) => l.name === 'Bills' ? sumA((c.bills || []).map(b => b.amount)) : (Number(l.qty) || 0) * (Number(l.unit) || 0);

/* Everything the screens need about one cycle, computed in one place. */
function calc(c) {
  const b = bounds(c), t = today();
  const days = Math.max(1, diffDays(c.start, c.payday));
  const isCur = t >= b.from && (!b.to || t < b.to);
  const isPast = !isCur && t >= b.from;
  const elapsed = isCur ? clamp(diffDays(c.start, t) + 1, 1, days) : (isPast ? days : 0);
  const daysLeft = isCur ? Math.max(0, diffDays(t, c.payday)) : 0;
  const pace = elapsed / days;

  const list = S.expenses.filter(e => inRange(e, b));
  const exp = list.filter(e => e.type === 'expense');
  const incomes = list.filter(e => e.type === 'income');
  const saves = list.filter(e => e.type === 'save');
  const spentBy = {}, todayBy = {};
  exp.forEach(e => { spentBy[e.category] = (spentBy[e.category] || 0) + e.amount; if (e.date === t) todayBy[e.category] = (todayBy[e.category] || 0) + e.amount; });

  /* Money in mid-cycle can top up a category (its category = that line's name). Otherwise it adds to savings. */
  const topUp = {}; const lineNames = new Set(c.lines.map(l => l.name));
  incomes.forEach(e => { if (lineNames.has(e.category)) topUp[e.category] = (topUp[e.category] || 0) + e.amount; });
  const lines = c.lines.map(l => {
    const base = lineTotal(l, c), total = base + (topUp[l.name] || 0), spent = spentBy[l.name] || 0, ratio = total ? spent / total : (spent ? Infinity : 0);
    let status;
    if (!total && !spent) status = 'off';
    else if (!total) status = 'unplanned';
    else if (l.kind === 'fixed') status = spent >= total ? 'paid' : 'due';
    else if (ratio > 1) status = 'over';
    else if (ratio >= .9 || (isCur && ratio > Math.min(1, pace + .15))) status = 'watch';
    else status = 'ok';
    return Object.assign({}, l, { base, topUp: topUp[l.name] || 0, total, spent, left: total - spent, ratio, status, today: todayBy[l.name] || 0 });
  });
  const names = new Set(c.lines.map(l => l.name));
  const unplanned = Object.keys(spentBy).filter(n => !names.has(n)).map(n => ({ name: n, spent: spentBy[n] }));

  const income = Number(c.income) || 0, extra = sumE(incomes), saved = sumE(saves), spent = sumE(exp);
  const budget = sumA(lines.map(l => l.total));
  const target = income - sumA(lines.map(l => l.base));   // top-ups don't eat into the savings target
  const committed = sumA(lines.map(l => Math.max(l.total, l.spent))) + sumA(unplanned.map(u => u.spent));
  const projected = income + extra - committed;
  const shouldHave = (Number(c.carry) || 0) + income + extra - spent - saved;

  const flex = lines.filter(l => l.kind === 'flex' && l.total > 0);
  const flexBudget = sumA(flex.map(l => l.total)), flexSpent = sumA(flex.map(l => l.spent));
  const flexToday = sumA(flex.map(l => l.today));
  const flexLeftBefore = sumA(flex.map(l => Math.max(0, l.total - (l.spent - l.today))));
  const allowance = daysLeft ? flexLeftBefore / daysLeft : 0;
  const safeToday = allowance - flexToday;
  const forecastFlex = elapsed ? flexSpent / elapsed * days : 0;
  const billsTotal = sumA((c.bills || []).map(x => x.amount));

  return { c, b, days, isCur, isPast, elapsed, daysLeft, pace, list, exp, incomes, saves, spentBy, lines, unplanned,
    income, extra, saved, spent, budget, target, targetPct: income ? target / income : 0, committed, projected,
    shouldHave, flexBudget, flexSpent, flexToday, allowance, safeToday, forecastFlex, billsTotal };
}

/* Food: one value per day of the cycle. */
function dailySeries(k, name) {
  const arr = Array.from({ length: k.days }, () => 0);
  k.exp.forEach(e => { if (e.category === name) { const i = diffDays(k.c.start, e.date); if (i >= 0 && i < k.days) arr[i] += e.amount; } });
  return arr;
}

/* ---------- sync: optimistic + outbox ---------- */
function persist() {
  store.set('bi.cache', { expenses: S.expenses, cycles: S.cycles, counts: S.counts, settings: S.settings });
  store.set('bi.outbox', S.outbox);
}

function applyOp(op) {
  switch (op.action) {
    case 'add': op.expenses.forEach(e => { if (!S.expenses.some(x => x.id === e.id)) S.expenses.push(normExp(e)); }); break;
    case 'update': { const e = S.expenses.find(x => x.id === op.id); if (e) Object.assign(e, normExp(Object.assign({}, e, op.patch))); break; }
    case 'delete': S.expenses = S.expenses.filter(x => x.id !== op.id); break;
    case 'renameCategory': S.expenses.forEach(e => { if (e.category === op.from && e.date >= op.start && (!op.end || e.date < op.end)) e.category = op.to; }); break;
    case 'saveSettings': S.settings = JSON.parse(JSON.stringify(op.settings)); break;
    case 'saveCycle': { const c = JSON.parse(JSON.stringify(op.cycle)); const i = S.cycles.findIndex(x => x.id === c.id); if (i < 0) S.cycles.push(c); else S.cycles[i] = c; break; }
    case 'deleteCycle': S.cycles = S.cycles.filter(x => x.id !== op.id); break;
    case 'addCount': if (!S.counts.some(x => x.id === op.count.id)) S.counts.push(op.count); break;
  }
}

/* One user action = one call. Several ops are allowed (e.g. pay a bill = add expense + save cycle). */
function commit(...ops) {
  ops.forEach(op => { applyOp(op); S.outbox.push(JSON.parse(JSON.stringify(op))); });
  persist(); render(); flush();
}

const authErr = (m = 'signin_required') => { const e = new Error(m); e.auth = true; return e; };
async function idToken() {
  if (AUTH && AUTH.exp - Date.now() > 120000) return AUTH.token;
  return silentRefresh();                       // Google tokens last 1 hour; get a fresh one quietly
}
async function api(action, payload = {}, timeoutMs = 25000) {
  const tok = await idToken();
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const res = await fetch(APP.scriptUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({}, payload, { idToken: tok, action })), signal: ctl.signal });
    const j = await res.json();
    if (!j.ok) {
      if (j.error === 'signin_required') { AUTH = Object.assign({}, AUTH, { exp: 0 }); store.set('bi.auth', AUTH); throw authErr(); }
      if (j.error === 'not_allowed') { signOut('This Google account is not allowed to open this budget.'); throw authErr('not_allowed'); }
      const err = new Error(j.error || 'server error'); err.server = true; throw err;
    }
    return j.data;
  } finally { clearTimeout(timer); }
}

function setSync(s) { S.sync = s; const el = $('#sync'); if (el) el.outerHTML = syncPill(); }
function syncPill() {
  const n = S.outbox.length;
  if (S.sync === 'signin') return `<button class="sync error" id="sync" data-act="signin-again"><i></i>Sign in to sync${n ? ` (${n})` : ''}</button>`;
  const txt = S.sync === 'saving' ? 'Saving…' : S.sync === 'offline' ? `Offline${n ? `, ${n} waiting` : ''}` : S.sync === 'error' ? 'Sync problem' : (n ? `${n} waiting` : 'Synced');
  return `<button class="sync ${S.sync}" id="sync" data-act="sync-now" title="Tap to sync now"><i></i>${txt}</button>`;
}

async function flush() {
  if (!AUTH || S.flushing || !S.outbox.length) return;
  S.flushing = true; setSync('saving');
  try {
    while (S.outbox.length) {
      const op = S.outbox[0];
      await api(op.action, op);
      S.outbox.shift(); persist();
    }
    setSync('idle');
  } catch (e) {
    if (e.auth) setSync('signin');
    else if (e.server) {
      // The server rejected this op (e.g. bad data). Drop it so the queue does not jam, and say so.
      const bad = S.outbox.shift(); persist(); setSync('error');
      toast(`The sheet refused one change (${e.message}).`);
      console.warn('dropped op', bad, e);
    } else setSync('offline');
  } finally { S.flushing = false; }
}

async function pull() {
  if (!AUTH) return;
  await flush();
  if (S.outbox.length) return;                 // still offline: keep local state
  try {
    const d = await api('list');
    S.expenses = (d.expenses || []).map(normExp);
    S.cycles = d.cycles || [];
    S.counts = d.counts || [];
    S.settings = d.settings;
    migrate();
    persist(); S.loaded = true; setSync('idle');
    safeRender();
  } catch (e) { setSync(e.auth ? 'signin' : e.server ? 'error' : 'offline'); if (e.server) toast('Sheet: ' + e.message); if (!S.settings) render(); }
}

/* Don't redraw under the user's fingers: wait until they leave the field. */
function safeRender() {
  const a = document.activeElement;
  if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && !$('#sheet').contains(a)) { S.needsRender = true; return; }
  render();
}
document.addEventListener('focusout', () => setTimeout(() => { if (S.needsRender && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) { S.needsRender = false; render(); } }, 50));

/* Upgrade data from the first prototype (calendar months, daily/weekly modes). */
function migrate() {
  const ops = [];
  if (!S.settings || S.settings.v !== 2) {
    const old = S.settings || {};
    const accs = (old.accounts || []).map(a => ({ name: a.name, count: !/saving/i.test(a.name) }));
    const s = defaultSettings(old.name || (AUTH && AUTH.name) || '', accs.length ? accs : undefined);
    s.goals = (old.goals || []).map(g => ({ id: uid('g'), name: g.name, target: +g.target || 0, saved: +g.saved || 0, deadline: g.deadline || '' }));
    ops.push({ action: 'saveSettings', settings: s });
    applyOp(ops[ops.length - 1]);
  }
  if (ops.length) { S.outbox.push(...ops); persist(); flush(); }
}
</script>
<script>
/* ---------- icons ---------- */
const IC = {
  today:'<path d="M4 11.5 12 5l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-5H9v5H5.5A1.5 1.5 0 0 1 4 19z"/>',
  budget:'<rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M3.5 9.5h17M7.5 14.5h4"/>',
  money:'<ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/>',

  plus:'<path d="M12 5v14M5 12h14"/>',

  left:'<path d="M15 5l-7 7 7 7"/>', right:'<path d="M9 5l7 7-7 7"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  calendar:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M7.5 14h3M13.5 14h3M7.5 17h3"/>',
  income:'<path d="M12 19V5M6 11l6-6 6 6"/>'
};
const MARK = '<rect width="512" height="512" rx="112" fill="#17614F"/><circle cx="256" cy="214" r="124" fill="#F2B705"/><circle cx="256" cy="214" r="103" fill="none" stroke="#D49B00" stroke-width="7"/><path d="M222 142 V286" stroke="#17614F" stroke-width="34" stroke-linecap="round" fill="none"/><circle cx="266" cy="244" r="44" stroke="#17614F" stroke-width="34" fill="none"/><rect x="146" y="382" width="20" height="22" rx="6" fill="#9CCBB9"/><rect x="184" y="370" width="20" height="34" rx="6" fill="#9CCBB9"/><rect x="222" y="386" width="20" height="18" rx="6" fill="#9CCBB9"/><rect x="260" y="364" width="20" height="40" rx="6" fill="#9CCBB9"/><rect x="298" y="376" width="20" height="28" rx="6" fill="#9CCBB9"/><rect x="336" y="358" width="20" height="46" rx="6" fill="#F2B705"/><rect x="374" y="374" width="20" height="30" rx="6" fill="#9CCBB9"/><rect x="138" y="414" width="236" height="6" rx="3" fill="#9CCBB9" opacity=".55"/>';
const logo = s => `<svg class="mark" viewBox="0 0 512 512" width="${s}" height="${s}" aria-hidden="true">${MARK}</svg>`;
const ic = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

const TABS = [['today', 'Today'], ['calendar', 'Calendar'], ['budget', 'Budget'], ['money', 'Money'], ['insights', 'Insights']];
const STATUS_TXT = { ok:'On track', watch:'Watch', over:'Over', paid:'Paid', due:'Due', off:'Off', unplanned:'Not in plan' };

/* ---------- shell ---------- */
function render() {
  const root = $('#root');
  if (!CONFIGURED) { root.innerHTML = viewNotConfigured(); return; }
  if (!AUTH) { root.innerHTML = viewSignIn(); renderGoogleButton(); return; }
  if (!S.settings) {
    const failed = S.sync === 'offline' || S.sync === 'error' || S.sync === 'signin';
    root.innerHTML = `<div class="connect"><div class="card stack" style="text-align:center">${failed
      ? `<h2>${S.sync === 'signin' ? 'Please sign in again' : "Can't reach your sheet"}</h2><p class="mute">${S.sync === 'signin' ? 'Your Google session ended.' : 'Check your connection, then try again.'}</p>
         <button class="btn" data-act="${S.sync === 'signin' ? 'signin-again' : 'retry'}">${S.sync === 'signin' ? 'Sign in' : 'Try again'}</button><button class="link" data-act="signout">Sign out</button>`
      : `<p class="mute">Loading your budget…</p>`}</div></div>`;
    return;
  }
  if (!S.cycles.length) { root.innerHTML = viewSetup(); return; }
  const title = S.tab === 'today' ? `Hi ${esc(S.settings.name || 'there')}` : TABS.find(t => t[0] === S.tab)[1];
  const view = { today: viewToday, calendar: viewCalendar, budget: viewBudget, money: viewMoney, insights: viewInsights }[S.tab] || viewToday;
  root.innerHTML = `
  <div class="shell">
    <aside class="side">

/* ---------- TODAY ---------- */
function viewToday() {
  const c = curCycle(), k = calc(c), t = today();
  const todays = S.expenses.filter(e => e.date === t).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  const spentToday = sumE(todays.filter(e => e.type === 'expense'));
  const freq = frequent();
  return `<div class="grid two">
    <div class="col">
      ${hero(k)}

        <div class="card-h"><div><h2>Today</h2><p>${todays.length ? `${todays.length} entr${todays.length > 1 ? 'ies' : 'y'}. Tap one to edit.` : 'Nothing logged yet'}</p></div><b class="num" style="font-family:var(--display);font-size:22px">${rp(spentToday)}</b></div>
        ${freq.length ? `<p class="small mute" style="margin-bottom:8px">Tap to log again</p><div class="chips" style="margin-bottom:10px">${freq.map((f, i) => `<button class="chip" data-act="quick" data-i="${i}">${esc(f.item)} <small>${short(f.amount)}</small></button>`).join('')}</div>` : ''}
        ${todays.length ? todays.map(expRow).join('') : `<div class="empty">Log your first expense with the yellow + button. Typing <b>bakso 25k, parkir 2k</b> works.</div>`}
        <div class="row" style="margin-top:12px"><button class="btn sm ghost" data-act="income-new">${ic('income', 16)}Add income</button><button class="btn sm ghost" data-act="tab" data-tab="calendar">${ic('calendar', 16)}Calendar</button></div>
      </section>
    </div>
    <div class="col">
      ${foodCard(k)}
      ${nudgeCard(k)}
      ${billsSoonCard(k)}
    </div>

}

function hero(k) {
  if (!k.daysLeft) {
    return `<section class="hero">
      <div class="lbl"><span>Payday ${fd(k.c.payday, {day:'numeric', month:'long'})}</span></div>
      <div class="big">It's payday</div>
      <p class="sub">This cycle ends with a projected <b>${rp(k.projected)}</b> saved. Start the next cycle to set this month's plan.</p>
      <button class="btn gold" style="margin-top:14px" data-act="next">Start next cycle</button>
    </section>`;
  }
  const flexNames = new Set(k.lines.filter(l => l.kind === 'flex').map(l => l.name));
  const per = Array.from({ length: k.days }, () => 0);
  k.exp.forEach(e => { if (flexNames.has(e.category)) { const i = diffDays(k.c.start, e.date); if (i >= 0 && i < k.days) per[i] += e.amount; } });
  const base = k.flexBudget / k.days, max = Math.max(base * 2, ...per, 1), W = 300, H = 38, step = W / k.days, bw = Math.max(2, step - 2);
  const ti = k.elapsed - 1;
  const bars = per.map((v, i) => {
    const x = (i * step + 1).toFixed(1);
    if (i > ti) return `<rect x="${x}" y="${H - 3}" width="${bw.toFixed(1)}" height="3" rx="1" style="fill:rgba(255,255,255,.18)"/>`;
    const h = Math.max(3, v / max * (H - 4));
    const fill = i === ti ? 'var(--gold)' : v > base ? '#FFB4A8' : 'rgba(255,255,255,.6)';
    return `<rect x="${x}" y="${(H - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" style="fill:${fill}"/>`;
  }).join('');
  const baseY = (H - base / max * (H - 4)).toFixed(1);
  const s = k.safeToday;
  return `<section class="hero" aria-label="Safe to spend today">
    <div class="lbl"><span>Safe to spend today</span><button class="q" data-act="explain-safe" aria-label="How is this worked out?">?</button></div>
    <div class="big num ${s < 0 ? 'neg' : ''}">${rp(s)}</div>
    <p class="sub">${s < 0 ? `You're <b>${rp(-s)}</b> over today's share. Tomorrow's allowance shrinks a little to make up for it.`
      : `Daily allowance <b>${rp(k.allowance)}</b>${k.flexToday ? `, of which <b>${rp(k.flexToday)}</b> is spent` : ''}.`}</p>
    <div class="ruler">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Day-to-day spending for each day of this pay cycle">
        <line x1="0" x2="${W}" y1="${baseY}" y2="${baseY}" style="stroke:rgba(255,255,255,.35);stroke-dasharray:3 3"/>${bars}
      </svg>
      <div class="ends"><span>Paid ${fd(k.c.start)}</span><span><b>${k.daysLeft} day${k.daysLeft > 1 ? 's' : ''}</b> to payday, ${fd(k.c.payday)}</span></div>
    </div>
  </section>`;
}

function expRow(e) {
  const sign = e.type === 'income' ? '+' : e.type === 'save' ? '→' : '';
  return `<div class="li tap" data-act="edit" data-id="${esc(e.id)}">
    <span class="dot" style="background:${e.type === 'save' ? 'var(--brand)' : e.type === 'income' ? 'var(--ok)' : colorOf(e.category)}"></span>
    <div class="main"><b>${esc(e.item)}</b><span>${esc(e.type === 'save' ? 'Moved to savings' : e.type === 'income' ? (e.category === 'Income' ? 'Money in, to savings' : 'Money in, tops up ' + e.category) : e.category)}${e.account ? `, ${esc(e.account)}` : ''}</span></div>
    <div class="amt num ${e.type === 'income' ? 'in' : ''}">${sign}${rp(e.amount)}</div>
  </div>`;
}

function foodLine(k) { return k.lines.find(l => l.track === 'day' && l.total > 0); }
function foodStats(k) {
  const f = foodLine(k); if (!f) return null;
  const target = f.qty > 1 ? f.unit : f.total / k.days;
  const s = dailySeries(k, f.name), ti = k.elapsed - 1;
  let streak = 0; for (let i = ti - 1; i >= 0 && s[i] <= target; i--) streak++;
  const jar = sumA(s.slice(0, Math.max(0, ti)).map(v => Math.max(0, target - v)));
  const overDays = s.slice(0, Math.max(0, ti)).filter(v => v > target).length;
  return { f, target, s, ti, today: k.isCur ? s[ti] || 0 : 0, streak, jar, overDays };
}
function foodCard(k) {
  const st = foodStats(k); if (!st || !k.daysLeft) return '';
  const left = st.target - st.today, w = clamp(st.today / st.target * 100, 0, 100);
  return `<section class="card">
    <div class="card-h"><div><h2>${esc(st.f.name)} today</h2><p>Target ${rp(st.target)} a day</p></div><span class="pill ${left < 0 ? 'over' : 'ok'}">${left < 0 ? 'Over' : 'Within'}</span></div>
    <div class="between"><b class="num" style="font-family:var(--display);font-size:28px">${rp(st.today)}</b><span class="small mute">${left >= 0 ? `${rp(left)} left` : `${rp(-left)} over`}</span></div>
    <div class="bar" style="margin-top:8px"><i style="width:${w}%;background:${left < 0 ? 'var(--bad)' : 'var(--ok)'}"></i></div>
    <p class="small mute" style="margin-top:10px">${st.streak ? `${st.streak}-day streak within target. ` : ''}${st.jar > 0 ? `${rp(st.jar)} unspent from your food target so far.` : ''}</p>
  </section>`;
}

/* HEMAT nudges: only the ones that matter right now, most useful first. */
function nudges(k) {
  const out = [], t = today();
  if (!k.daysLeft) return out;
  const lastCount = S.counts.slice().sort((a, b) => b.at.localeCompare(a.at))[0];
  const ago = lastCount ? diffDays(lastCount.date, t) : null;
  k.lines.filter(l => l.kind === 'flex' && l.total > 0 && l.status === 'over').forEach(l =>
    out.push({ tone: 'bad', ic: '🛑', text: `<b>${esc(l.name)}</b> is over budget by ${rp(-l.left)}. Anything more here comes out of your savings target.` }));
  k.lines.filter(l => l.kind === 'flex' && l.total > 0 && l.status === 'watch' && l.group === 'want').forEach(l =>
    out.push({ ic: '⚠️', text: `<b>${esc(l.name)}</b> is at ${pct(l.ratio)} of budget on day ${k.elapsed} of ${k.days}. A no-${esc(l.name.toLowerCase())} day or two brings it back on pace.` }));
  (k.c.bills || []).filter(b => !b.paid && diffDays(t, b.due) <= 3).forEach(b =>
    out.push({ tone: diffDays(t, b.due) < 0 ? 'bad' : '', ic: '📅', text: `<b>${esc(b.name)}</b> ${rp(b.amount - (b.paidAmount || 0))} is ${diffDays(t, b.due) < 0 ? 'overdue' : diffDays(t, b.due) === 0 ? 'due today' : `due ${fdw(b.due)}`}. Late fees on paylater add up fast.`, act: ['Mark paid', 'bill-pay', b.id] }));
  if (ago === null || ago >= 3) out.push({ ic: '🧮', text: ago === null ? 'You haven\'t done a cycle count yet. It takes a minute and catches forgotten expenses early.' : `Last cycle count was ${ago} days ago. A quick count keeps the numbers honest.`, act: ['Count now', 'tab', 'money'] });
  const st = foodStats(k);
  if (st && st.jar >= 50000) out.push({ tone: 'good', ic: '🍱', text: `You've kept ${rp(st.jar)} of your food money unspent. Move it to Saving now so it doesn't leak into snacks.`, act: ['Move to savings', 'save', String(Math.floor(st.jar / 1000) * 1000)] });
  const ready = (S.settings.wishlist || []).filter(w => w.status === 'waiting' && diffDays(w.added, t) >= COOL_OFF_DAYS);
  if (ready.length) out.push({ ic: '🛍️', text: `${ready.length} wishlist item${ready.length > 1 ? 's have' : ' has'} finished the ${COOL_OFF_DAYS}-day cool-off. Still want ${ready.length > 1 ? 'them' : 'it'}?`, act: ['Decide', 'tab', 'money'] });
  if (k.daysLeft <= 3 && k.projected > 0) out.push({ tone: 'good', ic: '🎯', text: `Payday is ${k.daysLeft} day${k.daysLeft > 1 ? 's' : ''} away. Sweep what's left of the day-to-day budget into Saving before the new cycle starts.`, act: ['Move to savings', 'save', ''] });
  return out;
}
function nudgeCard(k) {
  const n = nudges(k).slice(0, 3);
  if (!n.length) return `<section class="card"><div class="nudge good"><span class="ic">✅</span><p>Nothing needs your attention. Every budget is on pace.</p></div></section>`;
  return `<section class="card"><div class="card-h"><div><h2>Worth a look</h2></div></div>
    ${n.map(x => `<div class="nudge ${x.tone || ''}"><span class="ic" aria-hidden="true">${x.ic}</span><div><p>${x.text}</p>${x.act ? `<button class="btn sm ghost act" data-act="${x.act[1]}" data-tab="${esc(x.act[2])}" data-id="${esc(x.act[2])}" data-amt="${esc(x.act[2])}">${x.act[0]}</button>` : ''}</div></div>`).join('')}
  </section>`;
}
function billsSoonCard(k) {
  const t = today(), bills = (k.c.bills || []).filter(b => !b.paid).sort((a, b) => a.due.localeCompare(b.due));
  if (!bills.length) return '';
  return `<section class="card"><div class="card-h"><div><h2>Unpaid bills</h2><p>${rp(sumA(bills.map(b => b.amount - (b.paidAmount || 0))))} left to pay this cycle</p></div></div>
    ${bills.slice(0, 4).map(b => billRow(b, t)).join('')}</section>`;
}
function billRow(b, t = today()) {
  const d = diffDays(t, b.due), part = !b.paid && b.paidAmount > 0 ? `, ${rp(b.paidAmount)} paid so far` : '';
  const when = (b.paid ? `Paid${b.paidOn ? ' ' + fd(b.paidOn) : ''}` : d < 0 ? `${-d} day${d < -1 ? 's' : ''} overdue` : d === 0 ? 'Due today' : `Due ${fdw(b.due)}`) + part;
  return `<div class="li"><div class="main"><b>${esc(b.name)}</b><span style="${!b.paid && d < 0 ? 'color:var(--bad)' : ''}">${when}</span></div>
    <div class="amt num">${rp(b.amount)}</div>
    <button class="pill ${b.paid ? 'paid' : 'due'}" data-act="${b.paid ? 'bill-unpay' : 'bill-pay'}" data-id="${esc(b.id)}" aria-label="${b.paid ? 'Mark unpaid' : 'Mark paid'}">${b.paid ? 'Paid' : 'Mark paid'}</button></div>`;
}

/* ---------- BUDGET ---------- */
function viewCycle() { return S.cycles.find(c => c.id === S.viewId) || curCycle(); }
function viewBudget() {
  const c = viewCycle(), k = calc(c), b = k.b;
  const state = k.isCur ? (k.daysLeft ? `Current, day ${k.elapsed} of ${k.days}` : 'Payday reached') : k.isPast ? 'Closed' : 'Upcoming';
  const shown = k.lines.filter(l => l.status !== 'off'), off = k.lines.filter(l => l.status === 'off');
  const usedPct = k.budget ? k.spent / k.budget : 0;
  return `
  <div class="cyc">
    <button class="iconbtn" data-act="cyc" data-d="-1" ${b.prev ? '' : 'disabled'} aria-label="Previous cycle">${ic('left', 18)}</button>
    <div class="t"><b>${fd(c.start)} – ${fd(addDays(c.payday, -1), {day:'numeric', month:'short', year:'numeric'})}</b><span class="small mute">${state}</span></div>
    <button class="iconbtn" data-act="cyc" data-d="1" ${b.next ? '' : 'disabled'} aria-label="Next cycle">${ic('right', 18)}</button>
  </div>
  ${!k.budget || !k.income ? `<div class="nudge" style="margin-bottom:14px"><span class="ic">📝</span><div><p>${!k.income ? 'Add your salary and ' : 'Add '}an amount for each category to see your savings target. Use Qty × amount, like your sheet (Food: 29 × Rp35.000).</p><button class="btn sm ghost act" data-act="plan">Fill in plan</button></div></div>` : ''}
  <div class="grid two">
    <div class="col">
      <section class="card">
        <div class="kv">
          <button class="tile" data-act="basics" aria-label="Edit salary and dates"><small>Salary ${ic('edit', 12)}</small><b class="num">${rp(k.income)}</b></button>
          <button class="tile" data-act="plan" aria-label="Edit plan"><small>Planned spending ${ic('edit', 12)}</small><b class="num">${rp(k.budget)}</b></button>
          <div><small>Savings target, ${pct(k.targetPct)}</small><b class="num">${rp(k.target)}</b></div>
          <div><small>${k.isPast ? 'Actually saved' : 'Projected savings'}</small><b class="num" style="color:${k.projected >= k.target ? 'var(--ok)' : 'var(--warn)'}">${rp(k.isPast ? k.income + k.extra - k.spent : k.projected)}</b></div>
        </div>
        <div class="between small" style="margin-top:14px"><span>Used ${rp(k.spent)}</span><span class="mute">Left ${rp(k.budget - k.spent)}</span></div>
        <div class="bar" style="margin-top:6px"><i style="width:${clamp(usedPct * 100, 0, 100)}%;background:${usedPct > 1 ? 'var(--bad)' : 'var(--brand)'}"></i>${k.isCur ? `<b style="left:${k.pace * 100}%" title="Where you'd be at an even pace"></b>` : ''}</div>
        ${k.isCur ? `<p class="tiny mute" style="margin-top:6px">The tick marks an even pace for day ${k.elapsed}. Fixed costs like Boarding usually push you ahead of it early in the cycle.</p>` : ''}
        ${k.incomes.length ? `<div style="margin-top:12px"><p class="small"><b>Extra income this cycle: ${rp(k.extra)}</b></p>${k.incomes.slice().sort((a, b) => b.date.localeCompare(a.date)).map(expRow).join('')}</div>` : ''}
        ${k.saved ? `<p class="small mute" style="margin-top:8px">Moved to savings ${rp(k.saved)}.</p>` : ''}
        <div class="row" style="margin-top:14px"><button class="btn sm ghost" data-act="plan">${ic('edit', 16)}Edit plan</button><button class="btn sm ghost" data-act="income-new">${ic('income', 16)}Add income</button>${k.isCur ? `<button class="btn sm ${k.daysLeft <= 3 ? 'gold' : 'ghost'}" data-act="next">Start next cycle</button>` : ''}</div>
      </section>
      <section class="card">
        <div class="card-h"><div><h2>Categories</h2><p>Tap a row to see its entries or change its budget</p></div></div>
        ${shown.map(l => catRow(l, k)).join('')}
        ${k.unplanned.map(u => catRow({ name: u.name, qty: 0, unit: 0, total: 0, spent: u.spent, left: -u.spent, ratio: Infinity, status: 'unplanned', kind: 'flex' }, k)).join('')}
        ${off.length ? `<p class="small mute" style="margin-top:12px">No budget yet. Tap to set one:</p><div class="chips" style="flex-wrap:wrap;margin-top:6px">${off.map(l => `<button class="chip" data-act="line-edit" data-name="${esc(l.name)}">${esc(l.name)}</button>`).join('')}</div>` : ''}
      </section>
    </div>
    <div class="col">
      ${foodStripCard(k)}
      ${fuelCard(k)}
      <section class="card">
        <div class="card-h"><div><h2>Bills</h2><p>${(c.bills || []).length ? `${rp(k.billsTotal)} this cycle. This is the Bills budget.` : 'No bills this cycle.'}</p></div><button class="link" data-act="bill-new">Add bill</button></div>
        ${(c.bills || []).slice().sort((a, b) => a.due.localeCompare(b.due)).map(b => billRow(b)).join('') || '<div class="empty">Add paylater, credit card or loan payments here so they come out of the plan first.</div>'}
      </section>
    </div>
  </div>`;
}

function catRow(l, k) {
  const col = colorOf(l.name), open = S.open[l.name];
  const w = l.total ? clamp(l.ratio * 100, 0, 100) : 100;
  const barCol = l.status === 'over' || l.status === 'unplanned' ? 'var(--bad)' : l.status === 'watch' ? 'var(--warn)' : col;
  const plan = (l.name === 'Bills' ? `${(k.c.bills || []).length} bill${(k.c.bills || []).length === 1 ? '' : 's'}` : l.base ? `${l.qty} × ${rp(l.unit)}` : l.status === 'unplanned' ? 'Not in this plan' : 'No budget yet') + (l.topUp ? ` + ${rp(l.topUp)} top-up` : '');
  const items = open ? k.exp.filter(e => e.category === l.name).sort((a, b) => b.date.localeCompare(a.date)) : [];
  const payBtn = k.isCur && l.kind === 'fixed' && l.status === 'due' && l.name !== 'Bills'
     ? `<button class="btn sm ghost" data-act="pay-fixed" data-name="${esc(l.name)}">Log ${rp(l.left)} payment</button>` : '';
  return `<div class="cat" data-act="drill" data-name="${esc(l.name)}" aria-expanded="${open ? 'true' : 'false'}">
    <div class="t"><span class="dot" style="background:${col}"></span>
      <div class="n"><b>${esc(l.name)}</b><span>${plan}</span></div>
      <div class="r num"><b>${rp(l.spent)}</b><span class="mute">of ${rp(l.total)}</span></div>
      <span class="pill ${l.status}">${l.status === 'ok' || l.status === 'watch' ? pct(l.ratio) : STATUS_TXT[l.status]}</span>
    </div>
    <div class="bar"><i style="width:${w}%;background:${barCol}"></i></div>
    ${payBtn || (open && l.status !== 'unplanned') ? `<div class="row" style="margin-top:8px">${payBtn}${open && l.status !== 'unplanned' ? `<button class="btn sm ghost" data-act="line-edit" data-name="${esc(l.name)}">${ic('edit', 14)}Edit ${esc(l.name)} budget</button>` : ''}</div>` : ''}
    ${open ? `<div class="drill">${items.length ? items.map(e => `<div class="li tap" data-act="edit" data-id="${esc(e.id)}"><div class="main"><b>${esc(e.item)}</b><span>${fdw(e.date)}${e.account ? ', ' + esc(e.account) : ''}</span></div><div class="amt num">${rp(e.amount)}</div></div>`).join('') : '<div class="empty">No entries yet.</div>'}</div>` : ''}
  </div>`;
}

function foodStripCard(k) {
  const st = foodStats(k); if (!st) return '';
  const max = Math.max(st.target * 1.6, ...st.s, 1);
  const bars = st.s.map((v, i) => {
    const fut = k.isCur ? i > st.ti : !k.isPast;
    const cls = fut ? 'fut' : v === 0 ? '' : v <= st.target ? 'ok' : 'bad';
    const h = fut ? 4 : Math.max(3, v / max * 80);
    return `<div title="${fdw(addDays(k.c.start, i))}: ${rp(v)}"><i class="${cls} ${k.isCur && i === st.ti ? 'today' : ''}" style="height:${h}px"></i></div>`;
  }).join('');
  const past = k.isCur ? st.ti : k.days;
  const avg = past ? sumA(st.s.slice(0, past)) / past : 0;
  return `<section class="card">
    <div class="card-h"><div><h2>${esc(st.f.name)}, day by day</h2><p>Target ${rp(st.target)} a day</p></div><span class="pill ${st.overDays ? 'watch' : 'ok'}">${st.overDays} day${st.overDays === 1 ? '' : 's'} over</span></div>
    <div class="strip" role="img" aria-label="Food spending per day, green within target, red above">${bars}</div>
    <div class="strip-axis"><span>${fd(k.c.start)}</span><span>${fd(addDays(k.c.payday, -1))}</span></div>
    <div class="kv" style="margin-top:12px"><div><small>Daily average so far</small><b class="num">${rp(avg)}</b></div><div><small>Used of ${rp(st.f.total)}</small><b class="num">${rp(st.f.spent)}</b></div></div>
  </section>`;
}

function fuelCard(k) {
  const f = k.lines.find(l => l.track === 'week' && l.total > 0); if (!f) return '';
  const weeks = Math.ceil(k.days / 7), perDay = f.total / k.days, s = dailySeries(k, f.name);
  const curW = k.isCur ? Math.floor((k.elapsed - 1) / 7) : -1;
  const rows = Array.from({ length: weeks }, (_, w) => {
    const a = w * 7, z = Math.min(k.days, a + 7), budget = perDay * (z - a), spent = sumA(s.slice(a, z));
    const r = budget ? spent / budget : 0, over = spent > budget;
    return `<div class="cat" style="cursor:default"><div class="t"><div class="n"><b>Week ${w + 1}${w === curW ? ' (now)' : ''}</b><span>${fd(addDays(k.c.start, a))} – ${fd(addDays(k.c.start, z - 1))}</span></div>
      <div class="r num"><b>${rp(spent)}</b><span class="mute">of ${rp(budget)}</span></div><span class="pill ${over ? 'over' : 'ok'}">${over ? 'Over' : pct(r)}</span></div>
      <div class="bar"><i style="width:${clamp(r * 100, 0, 100)}%;background:${over ? 'var(--bad)' : colorOf(f.name)}"></i></div></div>`;
  }).join('');
  return `<section class="card"><div class="card-h"><div><h2>${esc(f.name)}, week by week</h2><p>${rp(perDay * 7)} a week</p></div></div>${rows}</section>`;
}

/* ---------- MONEY ---------- */
function lastCount() { return S.counts.slice().sort((a, b) => (b.at || '').localeCompare(a.at || ''))[0] || null; }
function viewMoney() {
  const c = curCycle(), k = calc(c), lc = lastCount(), draft = store.get('bi.countDraft', {});
  const accs = S.settings.accounts, counted = accs.filter(a => a.count), saving = accs.filter(a => !a.count);
  const accRow = a => `<label class="acc"><span>${esc(a.name)}${lc && lc.balances && lc.balances[a.name] != null ? `<small>Last: ${rp(lc.balances[a.name])}</small>` : ''}</span>
    <input class="money" inputmode="numeric" data-count="${esc(a.name)}" value="${esc(draft[a.name] ?? '')}" placeholder="Rp" aria-label="${esc(a.name)} balance"></label>`;
  const hist = S.counts.slice().sort((a, b) => (b.at || '').localeCompare(a.at || '')).slice(0, 6);
  const goals = S.settings.goals || [], wish = (S.settings.wishlist || []).filter(w => w.status === 'waiting');
  const skipped = sumA((S.settings.wishlist || []).filter(w => w.status === 'skipped').map(w => w.price));
  const hourly = k.income / HOURS_PER_MONTH;
  return `<div class="grid two">
    <div class="col">
      <section class="card" id="count-card">
        <div class="card-h"><div><h2>Cycle count</h2><p>Type what each account really shows right now.${lc ? ` Last count ${diffDays(lc.date, today()) ? diffDays(lc.date, today()) + ' days ago' : 'today'}.` : ''}</p></div><button class="link" data-act="explain-count">How?</button></div>
        <div class="kv"><div><small>The app expects</small><b class="num">${rp(k.shouldHave)}</b></div><div><small>You counted</small><b class="num" id="cnt-total">Rp0</b></div></div>
        <div style="margin-top:8px">${counted.map(accRow).join('')}</div>
        ${saving.length ? `<h3 style="margin-top:16px">Savings accounts</h3><p class="small mute">Not part of the count. Used for the safety-net check in Insights.</p>${saving.map(accRow).join('')}` : ''}
        <div id="cnt-result"></div>
        <div class="row" style="margin-top:14px"><button class="btn" data-act="count-save">Save count</button>${lc ? `<button class="btn ghost" data-act="count-copy">Fill in last count</button>` : ''}</div>
      </section>
      ${hist.length ? `<section class="card"><div class="card-h"><div><h2>Count history</h2></div></div>
        ${hist.map(h => `<div class="li"><div class="main"><b>${fdw(h.date)}</b><span>Counted ${rp(h.counted)}, expected ${rp(h.expected)}</span></div><span class="pill ${Math.abs(h.diff) < 1 ? 'ok' : 'over'}">${Math.abs(h.diff) < 1 ? 'Matched' : (h.diff > 0 ? '+' : '') + short(h.diff)}</span></div>`).join('')}</section>` : ''}
    </div>
    <div class="col">
      <section class="card">
        <div class="card-h"><div><h2>Savings goals</h2><p>Moved this cycle: ${rp(k.saved)}</p></div><button class="link" data-act="goal-new">New goal</button></div>
        ${goals.length ? goals.map(g => {
          const r = g.target ? clamp(g.saved / g.target, 0, 1) : 0, left = Math.max(0, g.target - g.saved);
          const months = g.deadline ? Math.max(1, (pd(g.deadline + '-01').getFullYear() - new Date().getFullYear()) * 12 + pd(g.deadline + '-01').getMonth() - new Date().getMonth() + 1) : 0;
          return `<div class="li"><div class="main"><b>${esc(g.name)}</b><span>${rp(g.saved)} of ${rp(g.target)}${months && left ? `. ${rp(left / months)} a month to finish by ${fd(g.deadline + '-01', {month:'short', year:'numeric'})}` : left ? '' : '. Reached'}</span>
            <div class="bar" style="margin-top:6px"><i style="width:${r * 100}%;background:var(--brand)"></i></div></div>
            <div class="row" style="flex-direction:column;gap:6px"><button class="btn sm" data-act="save" data-goal="${esc(g.id)}">Add</button><button class="link small" data-act="goal-edit" data-id="${esc(g.id)}">Edit</button></div></div>`;
        }).join('') : `<div class="empty">A first goal that fits you: an emergency fund of 3× your monthly needs (${rp(3 * sumA(k.lines.filter(l => l.group !== 'want').map(l => l.total)))}).</div>`}
        <button class="btn ghost block" style="margin-top:12px" data-act="save">Move money to savings</button>
      </section>
      <section class="card">
        <div class="card-h"><div><h2>Wishlist cool-off</h2><p>Park a want for ${COOL_OFF_DAYS} days before buying.${skipped ? ` Skipping has kept ${rp(skipped)} in your pocket.` : ''}</p></div><button class="link" data-act="wish-new">Add</button></div>
        ${wish.length ? wish.map(w => {
          const wait = COOL_OFF_DAYS - diffDays(w.added, today());

            ${wait > 0 ? `<span class="pill">${wait} day${wait > 1 ? 's' : ''} left</span>` : `<div class="row" style="flex-wrap:nowrap"><button class="btn sm ghost" data-act="wish-skip" data-id="${esc(w.id)}">Skip</button><button class="btn sm" data-act="wish-buy" data-id="${esc(w.id)}">Buy</button></div>`}</div>`;
        }).join('') : `<div class="empty">Seen something you want? Add it here instead of checking out. Most wants fade after a few days.</div>`}
      </section>
    </div>

}

function readCount() {
  const draft = store.get('bi.countDraft', {}), accs = S.settings.accounts;
  const balances = {}; let missing = 0;
  accs.forEach(a => { const v = draft[a.name]; if (v === undefined || v === '') { if (a.count) missing++; } else balances[a.name] = parseMoney(v); });
  const counted = sumA(accs.filter(a => a.count).map(a => balances[a.name] || 0));
  return { balances, counted, missing };
}
function updateCountResult() {
  const box = $('#cnt-result'); if (!box) return;
  const k = calc(curCycle()), r = readCount(), diff = r.counted - k.shouldHave;
  $('#cnt-total').textContent = rp(r.counted);
  if (r.missing === S.settings.accounts.filter(a => a.count).length) { box.innerHTML = ''; return; }
  if (r.missing) { box.innerHTML = `<div class="result"><p class="small">${r.missing} account${r.missing > 1 ? 's are' : ' is'} still empty. Type 0 if it really is empty.</p></div>`; return; }
  const ok = Math.abs(diff) < 1;
  box.innerHTML = `<div class="result ${ok ? 'ok' : 'bad'}">
    <div class="big2 num">${ok ? 'Matches' : (diff > 0 ? '+' : '−') + rp(Math.abs(diff)).replace('−', '')}</div>
    <p class="small">${ok ? 'Your real money matches the app. Nice and tidy.' : diff < 0
      ? `You have ${rp(-diff)} less than expected. Usually an expense you forgot to log.`
      : `You have ${rp(diff)} more than expected. Maybe a refund, a gift, or an IOU paid back.`}</p>
    ${ok ? '' : `<button class="btn sm ${diff < 0 ? 'danger' : 'ghost'}" style="margin-top:10px" data-act="count-fix" data-amt="${Math.round(diff)}">${diff < 0 ? `Log ${rp(-diff)} as unrecorded spending` : `Log ${rp(diff)} as other income`}</button>`}
  </div>`;
}
</script>

<script>
/* ---------- CALENDAR ---------- */
const FOOD_COLOR = 'var(--food)';
function foodNames() { const s = new Set(['Food']); S.cycles.forEach(c => c.lines.forEach(l => { if (l.track === 'day') s.add(l.name); })); return s; }
function viewCalendar() {
  const t = today();
  if (!S.calMonth) S.calMonth = t.slice(0, 7);
  if (!S.calSel) S.calSel = t;
  const [y, m] = S.calMonth.split('-').map(Number), n = dim(y, m - 1), lead = (new Date(y, m - 1, 1).getDay() + 6) % 7;
  const fn = foodNames(), days = {};
  S.expenses.forEach(e => {
    if (!e.date.startsWith(S.calMonth)) return;
    const d = days[e.date] || (days[e.date] = { tot: 0, food: 0, inc: 0 });
    if (e.type === 'expense') { d.tot += e.amount; if (fn.has(e.category)) d.food += e.amount; }
    else if (e.type === 'income') d.inc += e.amount;
  });
  // Scale bars to a typical day so one big payment (rent, bills) doesn't flatten the rest.
  const tots = Object.values(days).map(d => d.tot).filter(Boolean).sort((a, b) => a - b);
  const max = Math.max(1, (tots[Math.floor(tots.length * .8)] || 0) * 1.4);
  const paydays = new Set(S.cycles.map(c => c.start));
  const st = foodStats(calc(curCycle())), target = st ? st.target : 0;
  let cells = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<div class="cdow">${d[0]}</div>`).join('');
  for (let i = 0; i < lead; i++) cells += '<div></div>';
  for (let i = 1; i <= n; i++) {
    const ds = `${S.calMonth}-${pad(i)}`, d = days[ds] || { tot: 0, food: 0, inc: 0 }, fut = ds > t;
    const over = target && d.food > target;
    cells += `<button class="cd ${ds === S.calSel ? 'sel' : ''} ${ds === t ? 'now' : ''} ${fut ? 'fut' : ''}" data-act="cal-day" data-d="${ds}"
      aria-label="${fdw(ds)}: spent ${rp(d.tot)}, food ${rp(d.food)}${d.inc ? ', income ' + rp(d.inc) : ''}${paydays.has(ds) ? ', payday' : ''}">
      <span class="dn">${i}${paydays.has(ds) ? '<i class="pay" title="Payday"></i>' : ''}${d.inc ? '<i class="inc" title="Income">+</i>' : ''}</span>
      <span class="ct">${d.tot ? short(d.tot) : ''}</span>
      <span class="cf ${over ? 'over' : ''}">${d.food ? short(d.food) : ''}</span>
      ${d.tot ? `<span class="cb"><i style="width:${clamp(d.tot / max * 100, 8, 100)}%"><b style="width:${d.food / d.tot * 100}%"></b></i></span>` : '<span class="cb"></span>'}
    </button>`;
  }
  const vals = Object.values(days), spent = sumA(vals.map(d => d.tot)), food = sumA(vals.map(d => d.food));
  const counted = S.calMonth === t.slice(0, 7) ? +t.slice(8, 10) : S.calMonth < t.slice(0, 7) ? n : 0;
  const big = Object.entries(days).sort((a, b) => b[1].tot - a[1].tot)[0];
  const sel = S.calSel, list = S.expenses.filter(e => e.date === sel).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  const sd = days[sel] || { tot: 0, food: 0, inc: 0 };
  const label = new Date(y, m - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  return `<div class="grid two">
    <div class="col">
      <section class="card">
        <div class="cyc" style="margin:0 0 10px">
          <button class="iconbtn" data-act="cal-nav" data-d="-1" aria-label="Previous month">${ic('left', 18)}</button>
          <div class="t"><b>${label}</b>${S.calMonth !== t.slice(0, 7) ? '<button class="link small" data-act="cal-today">Back to today</button>' : ''}</div>
          <button class="iconbtn" data-act="cal-nav" data-d="1" aria-label="Next month">${ic('right', 18)}</button>
        </div>
        <div class="calg">${cells}</div>
        <div class="legend" style="margin-top:12px"><span><b class="num">100k</b> spent that day</span><span><b class="num" style="color:var(--food)">50k</b> of it on food</span><span><i class="pay" style="position:static"></i> payday</span><span><b style="color:var(--ok)">+</b> income</span></div>
        ${target ? `<p class="tiny mute" style="margin-top:6px">Food is red and underlined on days above your ${rp(target)} daily target.</p>` : ''}
      </section>
      <section class="card">
        <div class="card-h"><div><h2>${label.split(' ')[0]} at a glance</h2><p>Calendar month, all categories</p></div></div>
        <div class="kv">
          <div><small>Spent</small><b class="num">${rp(spent)}</b></div>
          <div><small>Food</small><b class="num" style="color:var(--food)">${rp(food)} <span class="small mute" style="font-family:var(--sans)">${spent ? pct(food / spent) : ''}</span></b></div>
          <div><small>Average per day</small><b class="num">${rp(counted ? spent / counted : 0)}</b></div>
          <div><small>Biggest day</small><b class="num">${big ? `${short(big[1].tot)}, ${fd(big[0])}` : '–'}</b></div>

    <div class="col">

        ${sel <= t ? `<div class="row" style="margin-top:12px"><button class="btn sm" data-act="cal-add">${ic('plus', 16)}Log spending for this day</button><button class="btn sm ghost" data-act="income-new" data-d="${sel}">${ic('income', 16)}Add income</button></div>` : ''}

</script><script>
/* ---------- INSIGHTS ---------- */
function health(k) {
  const t = today(), comps = [];
  const inc = k.income + k.extra, rate = inc ? k.projected / inc : 0;
  comps.push({ name: 'Savings rate', max: 35, pts: clamp(rate / .3, 0, 1) * 35,
    text: `On course to save ${pct(rate)} of income (${rp(k.projected)}). 20% is healthy, 30% or more is strong.` });
  const flex = k.lines.filter(l => l.kind === 'flex' && l.total > 0);
  const on = flex.filter(l => l.status !== 'over' && (!k.isCur || l.ratio <= Math.min(1, k.pace + .15)));
  const offPace = flex.filter(l => !on.includes(l)).map(l => l.name);
  comps.push({ name: 'Sticking to the plan', max: 25, pts: Math.max(0, (flex.length ? on.length / flex.length : 1) * 25 - (k.unplanned.length ? 3 : 0)),
    text: `${on.length} of ${flex.length} day-to-day budgets are on pace.${offPace.length ? ` Ahead of pace: ${offPace.join(', ')}.` : ''}${k.unplanned.length ? ` Spending outside the plan: ${k.unplanned.map(u => u.name).join(', ')}.` : ''}` });
  const due = (k.c.bills || []).filter(b => b.due <= t), paid = due.filter(b => b.paid);
  comps.push({ name: 'Bills paid on time', max: 15, pts: due.length ? paid.length / due.length * 15 : 15,
    text: due.length ? `${paid.length} of ${due.length} bills due so far are paid.` : 'No bills have come due yet this cycle.' });
  const dr = k.income ? k.billsTotal / k.income : 0;
  comps.push({ name: 'Debt load', max: 15, pts: dr <= .15 ? 15 : dr >= .4 ? 0 : 15 * (.4 - dr) / .25,
    text: `Bills take ${pct(dr)} of salary. Under 15% is comfortable; above 30% squeezes everything else.` });
  const lc = lastCount(), age = lc ? diffDays(lc.date, t) : null, match = lc && Math.abs(lc.diff) < 1000;
  comps.push({ name: 'Money matches the app', max: 10, pts: age === null ? 0 : age <= 3 ? (match ? 10 : 4) : age <= 7 ? (match ? 7 : 3) : 0,
    text: age === null ? 'No cycle count yet.' : `Last count ${age ? age + ' days ago' : 'today'}, ${match ? 'matched' : `off by ${rp(Math.abs(lc.diff))}`}.` });
  const score = Math.round(sumA(comps.map(c => c.pts)));
  const label = score >= 80 ? 'Strong' : score >= 60 ? 'Steady' : score >= 40 ? 'Needs attention' : 'At risk';
  return { score, label, comps };
}

function frequent() {
  const from = addDays(today(), -60), map = new Map();
  S.expenses.filter(e => e.type === 'expense' && e.date >= from).forEach(e => {
    const key = e.item.trim().toLowerCase() + '|' + e.amount;
    const m = map.get(key) || { item: e.item.trim(), amount: e.amount, category: e.category, account: e.account, n: 0, last: '' };
    m.n++; if (e.date >= m.last) { m.last = e.date; m.category = e.category; m.account = e.account; }
    map.set(key, m);
  });
  return [...map.values()].filter(m => m.n >= 2).sort((a, b) => b.n - a.n || b.last.localeCompare(a.last)).slice(0, 8);
}

function viewInsights() {
  const c = curCycle(), k = calc(c), h = health(k);
  const C = 2 * Math.PI * 42, col = h.score >= 80 ? 'var(--ok)' : h.score >= 60 ? 'var(--brand)' : h.score >= 40 ? 'var(--warn)' : 'var(--bad)';
  return `<div class="grid two">
    <div class="col">
      <section class="card">
        <div class="card-h"><div><h2>Financial health</h2><p>This cycle, scored out of 100</p></div></div>
        <div class="score">
          <svg width="108" height="108" viewBox="0 0 100 100" role="img" aria-label="Score ${h.score} out of 100">
            <circle cx="50" cy="50" r="42" style="fill:none;stroke:var(--sunk);stroke-width:10"/>
            <circle cx="50" cy="50" r="42" transform="rotate(-90 50 50)" style="fill:none;stroke:${col};stroke-width:10;stroke-linecap:round;stroke-dasharray:${(C * h.score / 100).toFixed(1)} ${C.toFixed(1)}"/>
            <text x="50" y="57" text-anchor="middle" style="font:800 26px var(--display);fill:var(--ink)">${h.score}</text>
          </svg>
          <div><h3 style="font-size:22px">${h.label}</h3><p class="small mute">${scoreLine(h)}</p></div>
        </div>
        <div style="margin-top:12px">${h.comps.map(x => `<div class="comp"><b>${x.name}</b><span class="small num">${Math.round(x.pts)} / ${x.max}</span>
          <div class="bar"><i style="width:${x.pts / x.max * 100}%;background:${x.pts / x.max >= .7 ? 'var(--ok)' : x.pts / x.max >= .4 ? 'var(--warn)' : 'var(--bad)'}"></i></div><p>${x.text}</p></div>`).join('')}</div>
      </section>
      ${projectionCard(k)}
      ${compareCard(k)}
    </div>
    <div class="col">
      ${askCard()}
      ${mixCard(k)}
      ${repeatCard()}
      ${safetyCard(k)}
      ${weekdayCard()}
    </div>
  </div>
  <div style="margin-top:14px">${historyCard()}</div>`;
}
const ASK = ['Where can I cut spending this cycle?', 'Am I on track for my savings target?', 'Give me a plan for the rest of this cycle.'];
function askCard() {
  return `<section class="card"><div class="card-h"><div><h2>Ask Budget AI</h2><p>Answers use your real numbers from this cycle</p></div></div>
    <div class="chips" style="flex-wrap:wrap">${ASK.map((q, i) => `<button class="chip" data-act="ask" data-i="${i}">${q}</button>`).join('')}</div>
    <div class="send" style="margin-top:10px"><textarea id="ask-in" rows="2" placeholder="Ask anything about your money"></textarea><button class="btn" data-act="ask">Ask</button></div>
    <div id="ask-out" class="small" style="white-space:pre-wrap;margin-top:10px;line-height:1.6">${esc(S.askOut)}</div></section>`;
}
function aiSummary() {
  const k = calc(curCycle()), lc = lastCount(), st = foodStats(k);
  return { today: today(), cycle: { start: k.c.start, nextPayday: k.c.payday, day: k.elapsed, days: k.days, daysLeft: k.daysLeft },
    salary: k.income, otherIncome: k.extra, plannedSpending: k.budget, spentSoFar: k.spent, savingsTarget: k.target, projectedSavings: k.projected,
    movedToSavings: k.saved, safeToSpendToday: Math.round(k.safeToday), dayToDayForecast: Math.round(k.forecastFlex), dayToDayBudget: k.flexBudget,
    categories: k.lines.filter(l => l.total || l.spent).map(l => ({ name: l.name, type: l.kind, group: l.group, budget: l.total, spent: l.spent, status: l.status })),
    notInPlan: k.unplanned, bills: (k.c.bills || []).map(b => ({ name: b.name, amount: b.amount, due: b.due, paid: !!b.paid, paidSoFar: b.paidAmount || 0 })),
    food: st ? { dailyTarget: st.target, todaySpent: st.today, daysOverTarget: st.overDays } : null,
    biggestItems: k.exp.slice().sort((a, b) => b.amount - a.amount).slice(0, 10).map(e => ({ item: e.item, amount: e.amount, category: e.category, date: e.date })),

}
function scoreLine(h) {
  const weakest = h.comps.slice().sort((a, b) => a.pts / a.max - b.pts / b.max)[0];

function projectionCard(k) {

function compareCard(k) {
  const prev = k.b.prev; if (!prev) return `<section class="card flat"><h3>Compared with last cycle</h3><p class="small mute" style="margin-top:6px">After your first full cycle, this shows what changed by category, comparing the same number of days.</p></section>`;
  const p = calc(prev), n = k.isCur ? k.elapsed : k.days;
  const prevBy = {}; p.exp.filter(e => diffDays(prev.start, e.date) < n).forEach(e => prevBy[e.category] = (prevBy[e.category] || 0) + e.amount);
  const names = [...new Set([...Object.keys(prevBy), ...Object.keys(k.spentBy)])];
  const rows = names.map(nm => ({ nm, a: k.spentBy[nm] || 0, b: prevBy[nm] || 0 })).map(r => Object.assign(r, { d: r.a - r.b }))
    .filter(r => r.d).sort((x, y) => Math.abs(y.d) - Math.abs(x.d)).slice(0, 6);

}

function mixCard(k) {
