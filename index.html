<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A4AA6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Budget.in</title>
<script>try{var t=JSON.parse(localStorage.getItem('bi.theme'));if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Budget.in">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* BRImo-inspired: deep bank blue, sky-blue canvas, orange accent */
  --bg:#EEF4FB; --surface:#FFFFFF; --sunk:#EAF2FC; --ink:#0B2545; --ink2:#2A4566; --mute:#5E7290; --line:#DCE6F3;
  --brand:#0A5CC2; --brand-ink:#FFFFFF; --brand-soft:#DCEAFE;
  --hero:linear-gradient(140deg,#0A4AA6 0%,#0F66D0 55%,#1E86EE 100%); --hero-ink:#FFFFFF; --hero-mute:#CFE2FB;
  --gold:#F59E0B; --gold-ink:#3A2300; --gold-soft:#FFF2DB;
  --ok:#12915A; --ok-soft:#DDF4E8; --warn:#B26A00; --warn-soft:#FFF0D6; --bad:#D23B3B; --bad-soft:#FDE3E3;
  --food:#7B4BC4; --food-soft:#ECE3FA;
  --shadow:0 2px 10px rgba(10,60,130,.07),0 1px 2px rgba(10,60,130,.05);
  --display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav-h:66px;
  color-scheme:light;
}
:root[data-theme="dark"]{
    --bg:#081423; --surface:#0F2136; --sunk:#152C47; --ink:#E6F0FB; --ink2:#BFD2EA; --mute:#8CA3C0; --line:#1D3A5C;
    --brand:#4C9BFF; --brand-ink:#04172E; --brand-soft:#173A66;
    --hero:linear-gradient(140deg,#0A3778 0%,#0D4FA3 60%,#1565C8 100%); --hero-ink:#FFFFFF; --hero-mute:#B4CDEE;
    --gold:#FFB547; --gold-ink:#2B1A00; --gold-soft:#3A2A10;
    --ok:#3FCB8A; --ok-soft:#123528; --warn:#F0B04A; --warn-soft:#3A2B12; --bad:#FF7A7A; --bad-soft:#3E1C1F;
    --food:#B996F2; --food-soft:#2C2240;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#081423; --surface:#0F2136; --sunk:#152C47; --ink:#E6F0FB; --ink2:#BFD2EA; --mute:#8CA3C0; --line:#1D3A5C;
    --brand:#4C9BFF; --brand-ink:#04172E; --brand-soft:#173A66;
    --hero:linear-gradient(140deg,#0A3778 0%,#0D4FA3 60%,#1565C8 100%); --hero-ink:#FFFFFF; --hero-mute:#B4CDEE;
    --gold:#FFB547; --gold-ink:#2B1A00; --gold-soft:#3A2A10;
    --ok:#3FCB8A; --ok-soft:#123528; --warn:#F0B04A; --warn-soft:#3A2B12; --bad:#FF7A7A; --bad-soft:#3E1C1F;
    --food:#B996F2; --food-soft:#2C2240;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0;width:100%;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
textarea{resize:vertical;min-height:76px;line-height:1.45}
label.f{display:block;font-size:13px;color:var(--mute);font-weight:600;margin:0 0 5px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.015em;margin:0;line-height:1.15}
h2{font-size:20px} h3{font-size:16px}
p{margin:0}
.mute{color:var(--mute)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack>*+*{margin-top:12px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.shell{max-width:1180px;margin:0 auto;padding:0 0 calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px))}
.side{display:none}
.band{background:var(--hero);color:var(--hero-ink);border-radius:0 0 28px 28px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 18px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top h1{font-size:22px;color:var(--hero-ink)}
.top .date{font-size:13px;color:var(--hero-mute)}
.band .sync{background:rgba(255,255,255,.16);border-color:transparent;color:#fff}
.band .iconbtn{background:rgba(255,255,255,.16);border-color:transparent;color:#fff}
.sync{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px;font-weight:600;color:var(--mute);padding:6px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.sync i{width:7px;height:7px;border-radius:50%;background:#5BE3A0}
.sync.saving i{background:var(--gold)} .sync.offline i,.sync.error i{background:#FF8A8A}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none;color:var(--ink)}
.tabpage{padding:0 14px}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.grid>*,.col{min-width:0}
.col{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}

/* ---------- cards ---------- */
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card.flat{background:transparent;border:1px dashed var(--line);box-shadow:none}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.card-h p{font-size:13px;color:var(--mute);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:700;background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.link{color:var(--brand);font-weight:700;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--sunk);color:var(--ink2)}
.pill.ok,.pill.paid{background:var(--ok-soft);color:var(--ok)}
.pill.watch,.pill.due{background:var(--warn-soft);color:var(--warn)}
.pill.over,.pill.unplanned{background:var(--bad-soft);color:var(--bad)}
.pill.off{background:transparent;color:var(--mute);border:1px dashed var(--line)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.bar{height:8px;border-radius:8px;background:var(--sunk);overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:8px;transition:width .35s}
.bar>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45;border-radius:2px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kv>div{background:var(--sunk);border-radius:14px;padding:10px 12px;min-width:0}
.kv small{display:block;font-size:12px;color:var(--mute);font-weight:600}
.kv b{font-family:var(--display);font-size:18px;font-weight:800;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:18px;text-align:center;color:var(--mute);font-size:14px}

/* ---------- hero (the one loud thing) ---------- */
.hero{margin-top:16px;position:relative}
.hero .lbl{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--hero-mute);font-weight:600}
.hero .big{font-weight:800;font-size:clamp(40px,12vw,58px);line-height:1;letter-spacing:-.03em;margin:8px 0 6px}
.hero .big.neg{color:#FFC2C2}
.hero .sub{font-size:14px;color:var(--hero-mute)}
.hero .sub b{color:var(--hero-ink)}
.hero .btn.gold{background:var(--gold);color:var(--gold-ink)}
.ruler{margin-top:16px;background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px 8px}
.ruler svg{width:100%;height:38px;display:block}
.ruler .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--hero-mute);margin-top:6px}
.ruler .ends b{color:#FFD27A}
.hero .q{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;color:var(--hero-ink);font-weight:700;font-size:13px}

/* ---------- lists ---------- */
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .main{flex:1;min-width:0}
.li .main b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .main span{font-size:12px;color:var(--mute)}
.li .amt{font-weight:700;text-align:right}
.li .amt.in{color:var(--ok)}
.li.tap{cursor:pointer}
.tagdot{display:inline-flex;align-items:center;gap:5px}

/* category rows */
.cat{padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.cat:first-child{border-top:0}
.cat .t{display:flex;align-items:center;gap:10px}
.cat .t .n{flex:1;min-width:0}
.cat .t .n b{font-weight:700}
.cat .t .n span{display:block;font-size:12px;color:var(--mute)}
.cat .t .r{text-align:right;font-size:13px}
.cat .t .r b{display:block;font-size:15px}
.cat .bar{margin-top:8px}
.cat .drill{margin-top:8px;background:var(--sunk);border-radius:12px;padding:4px 12px}
.cat .drill .li{border-color:var(--line)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{color:var(--mute);font-weight:600}
.chip.on small{color:inherit;opacity:.75}

/* nudges */
.nudge{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--gold-soft)}
.nudge+.nudge{margin-top:8px}
.nudge .ic{font-size:20px;line-height:1.2}
.nudge p{font-size:14px;color:var(--ink)}
.nudge .act{margin-top:8px}
.nudge.good{background:var(--ok-soft)} .nudge.bad{background:var(--bad-soft)}

/* charts */
.strip{display:flex;gap:2px;align-items:flex-end;height:84px;margin-top:10px}
.strip>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.strip i{display:block;border-radius:3px 3px 1px 1px;background:var(--sunk)}
.strip i.ok{background:var(--ok)} .strip i.bad{background:var(--bad)} .strip i.fut{background:transparent;border:1px dashed var(--line)} .strip i.today{outline:2px solid var(--ink);outline-offset:1px}
.strip-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:4px}
.mix{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--sunk)}
.mix i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.score{display:flex;gap:16px;align-items:center}
.score svg{flex:none}
.comp{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.comp:first-of-type{border-top:0}
.comp .bar{grid-column:1/-1}
.comp p{grid-column:1/-1;font-size:13px;color:var(--mute)}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:right;font-weight:600;color:var(--mute);padding:6px 4px;border-bottom:1px solid var(--line)}
.table th:first-child,.table td:first-child{text-align:left}
.table td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line)}
.scrollx{overflow-x:auto}

/* cycle switcher */
.cyc{display:flex;align-items:center;gap:8px;justify-content:space-between;margin:2px 0 12px}
.cyc .t{text-align:center;flex:1}
.cyc .t b{font-family:var(--display);font-size:18px;display:block}

/* forms */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg .full{grid-column:1/-1}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.prow{border:1px solid var(--line);border-radius:16px;padding:10px;background:var(--surface)}
.prow+.prow{margin-top:8px}
.prow .g{display:grid;grid-template-columns:1fr 128px;gap:8px}
.prow .g2{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:8px}
.prow input,.prow select{padding:9px 10px;font-size:15px}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
.xbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--mute);background:var(--sunk)}
.lrow{display:grid;grid-template-columns:1fr 64px 110px 36px;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lrow input,.lrow select{padding:8px 9px;font-size:14px}
.lrow .meta{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.lrow .tot{grid-column:1/-1;font-size:12px;color:var(--mute)}
.acc{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.acc:first-child{border-top:0}
.acc span{font-weight:600}
.acc small{display:block;color:var(--mute);font-size:12px;font-weight:500}
.result{margin-top:12px;border-radius:16px;padding:14px;background:var(--sunk)}
.result.ok{background:var(--ok-soft)} .result.bad{background:var(--bad-soft)}
.result .big2{font-family:var(--display);font-weight:800;font-size:26px}


/* ---------- AI chat ---------- */
.chat{display:flex;flex-direction:column;gap:10px;min-height:120px;padding-bottom:6px}
.bubble{max-width:92%;padding:12px 14px;border-radius:18px;font-size:15px;line-height:1.45}
.bubble.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.bubble.ai.good{background:var(--ok-soft);border-color:transparent}
.bubble.ai.done{opacity:.6}
.bubble.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:6px}
.plist{margin-top:10px;border-top:1px solid var(--line)}
.pi{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.pi>div{min-width:0}
.pi b{font-weight:700}
.pi span{display:block;font-size:12px;color:var(--mute)}
.pi .in{color:var(--ok)}
.pi.tot{border-bottom:0;font-weight:700}
.bubble .prow{margin-top:8px}
.composer{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--bg);padding:10px 0 6px;margin-top:8px;border-top:1px solid var(--line)}
.send{display:flex;gap:8px;align-items:flex-end}
.send textarea{min-height:48px;flex:1}
.send .btn{flex:none}
code{background:var(--sunk);padding:1px 5px;border-radius:5px;font-size:.92em}


/* calendar dots */
.cd .ct,.cd .cf{display:flex;align-items:center;gap:3px;white-space:nowrap}
.cd .ct::before,.cd .cf::before{content:"";width:6px;height:6px;border-radius:50%;flex:none}
.cd .ct:empty::before,.cd .cf:empty::before{display:none}
.cd .ct::before{background:var(--ok)}
.cd .cf::before{background:var(--food)}
.cd .cf{color:var(--ink2)}
.cd .cf.over{color:var(--bad)}
.cd .cb i{background:color-mix(in srgb,var(--ok) 45%,transparent)}
.lg i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* history switch + log */
.hseg{margin-bottom:12px}
.filters{display:grid;gap:10px}
.filters .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters select,.filters input{padding:9px 11px;font-size:15px}
.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 4px;font-size:13px;font-weight:700;color:var(--mute);border-bottom:1px solid var(--line)}
.dayh:first-child{padding-top:2px}
.logt{width:100%;border-collapse:collapse;font-size:14px}
.logt th{text-align:left;font-size:12px;font-weight:700;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
.logt td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.logt tr.tap{cursor:pointer}
.logt tr.tap:hover td{background:var(--sunk)}
.logt .r{text-align:right;white-space:nowrap;font-weight:700}
.logt .in{color:var(--ok)} .logt .sv{color:var(--brand)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.only-m{display:block} .only-d{display:none} .seg.only-m{display:flex}
@media (min-width:960px){ .only-m,.seg.only-m{display:none} .only-d{display:block} }

/* ---------- bottom tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);box-shadow:0 -2px 12px rgba(10,60,130,.08);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mute);padding:8px 2px;border-radius:12px;min-width:0}
.tabbar button.on{color:var(--brand)}
.tabbar button.on svg{background:var(--brand-soft);border-radius:10px;padding:2px 10px;box-sizing:content-box}
.tabbar svg,.side svg{width:22px;height:22px}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));z-index:21;width:60px;height:60px;border-radius:50%;background:var(--hero);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(10,74,166,.4)}
.fab:active{transform:scale(.95)}

/* editable tiles */
button.tile{display:block;text-align:left;background:var(--sunk);border-radius:14px;padding:10px 12px;min-width:0;border:1px solid transparent}
button.tile small{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mute);font-weight:600}
button.tile b{font-family:var(--display);font-size:18px;font-weight:800;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.tile:hover,button.tile:focus-visible{border-color:var(--brand)}

/* calendar */
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cdow{text-align:center;font-size:11px;font-weight:700;color:var(--mute);padding-bottom:2px}
.cd{display:flex;flex-direction:column;align-items:stretch;gap:1px;min-height:68px;padding:5px 4px 5px;border-radius:10px;background:var(--sunk);text-align:left;border:1.5px solid transparent;min-width:0;overflow:hidden}
.cd .dn{font-size:12px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:3px}
.cd .ct{font-size:12px;font-weight:800;color:var(--ink);line-height:1.2;min-height:14px}

<body>
<div id="root"></div>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
   Budget.in v2
   - Payday-to-payday cycles (not calendar months), each saved with its own plan,
     so history stays true even after you change budgets.
   - Offline-first: every change is applied on the phone first, queued, then sent
     to the Google Sheet. Bad signal never loses an entry.
   ===================================================================== */

/* ===== Paste your two values here (see the setup guide). Both are safe to publish. ===== */
const APP = {
  scriptUrl: 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL',
  clientId: 'PASTE_YOUR_CLIENT_ID.apps.googleusercontent.com'
};
const CONFIGURED = !/PASTE_/.test(APP.scriptUrl + APP.clientId);
const COOL_OFF_DAYS = 3;        // wishlist waiting period
const HOURS_PER_MONTH = 173;    // 40h x 4.33 weeks, for "hours of work"

/* ---------- storage ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let AUTH = store.get('bi.auth', null);   // {token, exp, email, name, picture} from Sign in with Google

const S = {
  expenses: [], cycles: [], counts: [], settings: null,
  outbox: store.get('bi.outbox', []),
  tab: store.get('bi.tab', 'today'), viewId: null, open: {},
  sync: 'idle', flushing: false, loaded: false, needsRender: false, authMsg: '', askOut: '',
  qa: null, sheet: null
};

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sumA = a => a.reduce((s, v) => s + (Number(v) || 0), 0);
const sumE = a => a.reduce((s, e) => s + (e.amount || 0), 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rp = n => { n = Math.round(n || 0); return (n < 0 ? '−' : '') + 'Rp' + Math.abs(n).toLocaleString('id-ID'); };
const short = n => { n = Math.round(n || 0); const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (a >= 1e6) return s + (a / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
  if (a >= 1e3) return s + Math.round(a / 1e3) + 'k'; return s + a; };
const pct = v => Math.round(v * 100) + '%';

const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const addMonths = (s, n) => { const d = pd(s), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); d.setDate(Math.min(day, dim(d.getFullYear(), d.getMonth()))); return ymd(d); };
const fd = (s, o = {day:'numeric', month:'short'}) => pd(s).toLocaleDateString('en-GB', o);
const fdw = s => fd(s, {weekday:'short', day:'numeric', month:'short'});

function toAmount(raw, suf) {
  suf = (suf || '').toLowerCase();
  if (['k', 'rb', 'ribu'].includes(suf)) return Math.round(parseFloat(String(raw).replace(',', '.')) * 1e3);
  if (['jt', 'juta'].includes(suf)) return Math.round(parseFloat(String(raw).replace(',', '.')) * 1e6);
  return Number(String(raw).replace(/[.,\s]/g, '')) || 0;
}
function parseMoney(v) {
  v = String(v ?? '').trim().toLowerCase().replace(/^rp\.?\s*/, '');
  const m = v.match(/^(\d+(?:[.,]\d+)*)\s*(k|rb|ribu|jt|juta)?$/);
  return m ? toAmount(m[1], m[2]) : (Number(v.replace(/\D/g, '')) || 0);
}
const mval = n => n ? Math.round(n).toLocaleString('id-ID') : '';

const PALETTE = ['#1F8A70','#D99A00','#D1495B','#3E7CB1','#8C5BB5','#E07A2E','#2A9D8F','#B5651D','#5C6BC0','#C2185B','#6D8B3A','#00838F','#9E7B00','#7B5E57','#607D8B'];
const colorOf = name => { let h = 0; for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };

/* ---------- data model ---------- */
/* Old names from the spreadsheet and the first prototype, mapped to the English names. */
const RENAME = { Makan:'Food', Jajan:'Snacks', Pokok:'Groceries', Bensin:'Fuel', Darurat:'Emergency', Parkir:'Parking',
  Rumah:'Housing', 'Lain-lain':'Others', 'Kuota+icloud':'Data & iCloud', 'Kuota+icloud+google':'Data & iCloud',
  Kos:'Boarding', Tagihan:'Bills', Listrik:'Electricity' };

const L = (name, qty, unit, kind, group, track = '') => ({ name, qty, unit, kind, group, track });
/* kind: flex = day-to-day spending (counts toward "safe to spend"), fixed = paid once, buffer = only if needed
   group: need / want / debt (for the 50/30/20 view)                       track: day | week */
function seedLines() {
  return [
    L('Food', 29, 35000, 'flex', 'need', 'day'),
    L('Snacks', 1, 400000, 'flex', 'want'),
    L('Groceries', 1, 230000, 'flex', 'need'),
    L('Fuel', 1, 100000, 'flex', 'need', 'week'),
    L('Parking', 1, 50000, 'flex', 'need'),
    L('Laundry', 1, 100000, 'flex', 'need'),
    L('Skincare', 0, 0, 'flex', 'want'),
    L('Others', 1, 50000, 'buffer', 'want'),
    L('Emergency', 1, 100000, 'buffer', 'need'),
    L('Boarding', 1, 650000, 'fixed', 'need'),
    L('Housing', 1, 500000, 'fixed', 'need'),
    L('Data & iCloud', 1, 70000, 'fixed', 'need'),
    L('Electricity', 0, 103000, 'fixed', 'need'),
    L('Admin', 0, 40000, 'fixed', 'need'),
    L('Bills', 1, 0, 'fixed', 'debt')
  ];
}
/* Same structure as your sheet, every amount at 0: you fill in your own numbers. */
const emptyLines = () => seedLines().map(l => Object.assign(l, { qty: 0, unit: 0 }));
function defaultAccounts() {
  return ['Mandiri', 'BCA', 'Superbank', 'Spay', 'Gopay / IOU', 'Cash'].map(n => ({ name: n, count: true }))
    .concat([{ name: 'Saving', count: false }]);
}
function defaultSettings(name, accounts) {
  return { v: 2, name: name || '', accounts: accounts || defaultAccounts(), goals: [], wishlist: [] };
}
function newCycle(start, payday, income, carry, lines, bills) {
  return { id: 'c' + start, start, payday, income: income || 0, carry: carry || 0, lines: lines || emptyLines(), bills: bills || [] };
}

function normExp(e) {
  return { id: String(e.id), date: String(e.date || '').slice(0, 10), item: String(e.item || ''),
    category: RENAME[e.category] || String(e.category || 'Others'), amount: Number(e.amount) || 0,
    account: String(e.account || ''), createdAt: String(e.createdAt || ''),
    type: ['income', 'save'].includes(e.type) ? e.type : 'expense' };
}

/* ---------- cycles ---------- */
const cyclesAsc = () => S.cycles.slice().sort((a, b) => a.start.localeCompare(b.start));
function bounds(c) {
  const asc = cyclesAsc(), i = asc.findIndex(x => x.id === c.id);
  return { from: c.start, to: asc[i + 1] ? asc[i + 1].start : null, prev: asc[i - 1] || null, next: asc[i + 1] || null };
}
function cycleFor(date) { let r = null; for (const c of cyclesAsc()) if (c.start <= date) r = c; return r; }
const curCycle = () => cycleFor(today()) || cyclesAsc()[0] || null;
const inRange = (e, b) => e.date >= b.from && (!b.to || e.date < b.to);
const lineTotal = (l, c) => l.name === 'Bills' ? sumA((c.bills || []).map(b => b.amount)) : (Number(l.qty) || 0) * (Number(l.unit) || 0);

/* Everything the screens need about one cycle, computed in one place. */
function calc(c) {
  const b = bounds(c), t = today();
  const days = Math.max(1, diffDays(c.start, c.payday));
  const isCur = t >= b.from && (!b.to || t < b.to);
  const isPast = !isCur && t >= b.from;
  const elapsed = isCur ? clamp(diffDays(c.start, t) + 1, 1, days) : (isPast ? days : 0);
  const daysLeft = isCur ? Math.max(0, diffDays(t, c.payday)) : 0;
  const pace = elapsed / days;

  const list = S.expenses.filter(e => inRange(e, b));
  const exp = list.filter(e => e.type === 'expense');
  const incomes = list.filter(e => e.type === 'income');
  const saves = list.filter(e => e.type === 'save');
  const spentBy = {}, todayBy = {};
  exp.forEach(e => { spentBy[e.category] = (spentBy[e.category] || 0) + e.amount; if (e.date === t) todayBy[e.category] = (todayBy[e.category] || 0) + e.amount; });

  /* Money in mid-cycle can top up a category (its category = that line's name). Otherwise it adds to savings. */
  const topUp = {}; const lineNames = new Set(c.lines.map(l => l.name));
  incomes.forEach(e => { if (lineNames.has(e.category)) topUp[e.category] = (topUp[e.category] || 0) + e.amount; });
  const lines = c.lines.map(l => {
    const base = lineTotal(l, c), total = base + (topUp[l.name] || 0), spent = spentBy[l.name] || 0, ratio = total ? spent / total : (spent ? Infinity : 0);
    let status;
    if (!total && !spent) status = 'off';
    else if (!total) status = 'unplanned';
    else if (l.kind === 'fixed') status = spent >= total ? 'paid' : 'due';
    else if (ratio > 1) status = 'over';
    else if (ratio >= .9 || (isCur && ratio > Math.min(1, pace + .15))) status = 'watch';
    else status = 'ok';
    return Object.assign({}, l, { base, topUp: topUp[l.name] || 0, total, spent, left: total - spent, ratio, status, today: todayBy[l.name] || 0 });
  });
  const names = new Set(c.lines.map(l => l.name));
  const unplanned = Object.keys(spentBy).filter(n => !names.has(n)).map(n => ({ name: n, spent: spentBy[n] }));

  const income = Number(c.income) || 0, extra = sumE(incomes), saved = sumE(saves), spent = sumE(exp);
  const budget = sumA(lines.map(l => l.total));
  const planLeft = income - sumA(lines.map(l => l.base));   // what the plan leaves over (top-ups don't count)
  const target = Number(c.savingsTarget) > 0 ? Number(c.savingsTarget) : planLeft;   // your own number wins if you set one
  const committed = sumA(lines.map(l => Math.max(l.total, l.spent))) + sumA(unplanned.map(u => u.spent));
  const projected = income + extra - committed;
  const shouldHave = (Number(c.carry) || 0) + income + extra - spent - saved;

  const flex = lines.filter(l => l.kind === 'flex' && l.total > 0);
  const flexBudget = sumA(flex.map(l => l.total)), flexSpent = sumA(flex.map(l => l.spent));
  const flexToday = sumA(flex.map(l => l.today));
  const flexLeftBefore = sumA(flex.map(l => Math.max(0, l.total - (l.spent - l.today))));
  const allowance = daysLeft ? flexLeftBefore / daysLeft : 0;
  const safeToday = allowance - flexToday;
  const forecastFlex = elapsed ? flexSpent / elapsed * days : 0;
  const billsTotal = sumA((c.bills || []).map(x => x.amount));

  return { c, b, days, isCur, isPast, elapsed, daysLeft, pace, list, exp, incomes, saves, spentBy, lines, unplanned,
    income, extra, saved, spent, budget, target, planLeft, customTarget: Number(c.savingsTarget) > 0, targetPct: income ? target / income : 0, committed, projected,
    shouldHave, flexBudget, flexSpent, flexToday, allowance, safeToday, forecastFlex, billsTotal };
}

/* Food: one value per day of the cycle. */
function dailySeries(k, name) {
  const arr = Array.from({ length: k.days }, () => 0);
  k.exp.forEach(e => { if (e.category === name) { const i = diffDays(k.c.start, e.date); if (i >= 0 && i < k.days) arr[i] += e.amount; } });
  return arr;
}

/* ---------- sync: optimistic + outbox ---------- */
function persist() {
  store.set('bi.cache', { expenses: S.expenses, cycles: S.cycles, counts: S.counts, settings: S.settings });
  store.set('bi.outbox', S.outbox);
}

function applyOp(op) {
  switch (op.action) {
    case 'add': op.expenses.forEach(e => { if (!S.expenses.some(x => x.id === e.id)) S.expenses.push(normExp(e)); }); break;
    case 'update': { const e = S.expenses.find(x => x.id === op.id); if (e) Object.assign(e, normExp(Object.assign({}, e, op.patch))); break; }
    case 'delete': S.expenses = S.expenses.filter(x => x.id !== op.id); break;
    case 'renameCategory': S.expenses.forEach(e => { if (e.category === op.from && e.date >= op.start && (!op.end || e.date < op.end)) e.category = op.to; }); break;
    case 'saveSettings': S.settings = JSON.parse(JSON.stringify(op.settings)); break;
    case 'saveCycle': { const c = JSON.parse(JSON.stringify(op.cycle)); const i = S.cycles.findIndex(x => x.id === c.id); if (i < 0) S.cycles.push(c); else S.cycles[i] = c; break; }
    case 'deleteCycle': S.cycles = S.cycles.filter(x => x.id !== op.id); break;
    case 'addCount': if (!S.counts.some(x => x.id === op.count.id)) S.counts.push(op.count); break;
  }
}

/* One user action = one call. Several ops are allowed (e.g. pay a bill = add expense + save cycle). */
function commit(...ops) {
  ops.forEach(op => { applyOp(op); S.outbox.push(JSON.parse(JSON.stringify(op))); });
  persist(); render(); flush();
}

const authErr = (m = 'signin_required') => { const e = new Error(m); e.auth = true; return e; };
async function idToken() {
  if (AUTH && AUTH.exp - Date.now() > 120000) return AUTH.token;
  return silentRefresh();                       // Google tokens last 1 hour; get a fresh one quietly
}
async function api(action, payload = {}, timeoutMs = 25000) {
  const tok = await idToken();
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const res = await fetch(APP.scriptUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({}, payload, { idToken: tok, action })), signal: ctl.signal });
    const j = await res.json();
    if (!j.ok) {
      if (j.error === 'signin_required') { AUTH = Object.assign({}, AUTH, { exp: 0 }); store.set('bi.auth', AUTH); throw authErr(); }
      if (j.error === 'not_allowed') { signOut('This Google account is not allowed to open this budget.'); throw authErr('not_allowed'); }
      const err = new Error(j.error || 'server error'); err.server = true; throw err;
    }
    return j.data;
  } finally { clearTimeout(timer); }
}

function setSync(s) { S.sync = s; const el = $('#sync'); if (el) el.outerHTML = syncPill(); }
function syncPill() {
  const n = S.outbox.length;
  if (S.sync === 'signin') return `<button class="sync error" id="sync" data-act="signin-again"><i></i>Sign in${n ? ` (${n})` : ''}</button>`;
  const txt = S.sync === 'saving' ? 'Saving…' : S.sync === 'offline' ? `Offline${n ? `, ${n} waiting` : ''}` : S.sync === 'error' ? 'Sync problem' : (n ? `${n} waiting` : 'Synced');
  return `<button class="sync ${S.sync}" id="sync" data-act="sync-now" title="Tap to sync now"><i></i>${txt}</button>`;
}

async function flush() {
  if (!AUTH || S.flushing || !S.outbox.length) return;
  S.flushing = true; setSync('saving');
  try {
    while (S.outbox.length) {
      const op = S.outbox[0];
      await api(op.action, op);
      S.outbox.shift(); persist();
    }
    setSync('idle');
  } catch (e) {
    if (e.auth) setSync('signin');
    else if (e.server) {
      // The server rejected this op (e.g. bad data). Drop it so the queue does not jam, and say so.
      const bad = S.outbox.shift(); persist(); setSync('error');
      toast(`The sheet refused one change (${e.message}).`);
      console.warn('dropped op', bad, e);
    } else setSync('offline');
  } finally { S.flushing = false; }
}

async function pull() {
  if (!AUTH) return;
  await flush();
  if (S.outbox.length) return;                 // still offline: keep local state
  try {
    const d = await api('list');
    S.expenses = (d.expenses || []).map(normExp);
    S.cycles = d.cycles || [];
    S.counts = d.counts || [];
    S.settings = d.settings;
    migrate();
    persist(); S.loaded = true; setSync('idle');
    safeRender();
  } catch (e) { setSync(e.auth ? 'signin' : e.server ? 'error' : 'offline'); if (e.server) toast('Sheet: ' + e.message); if (!S.settings) render(); }
}

/* Don't redraw under the user's fingers: wait until they leave the field. */
function safeRender() {
  const a = document.activeElement;
  if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && !$('#sheet').contains(a)) { S.needsRender = true; return; }
  render();
}
document.addEventListener('focusout', () => setTimeout(() => { if (S.needsRender && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) { S.needsRender = false; render(); } }, 50));

/* Upgrade data from the first prototype (calendar months, daily/weekly modes). */
function migrate() {
  const ops = [];
  if (!S.settings || S.settings.v !== 2) {
    const old = S.settings || {};
    const accs = (old.accounts || []).map(a => ({ name: a.name, count: !/saving/i.test(a.name) }));
    const s = defaultSettings(old.name || (AUTH && AUTH.name) || '', accs.length ? accs : undefined);

    ops.push({ action: 'saveSettings', settings: s });
    applyOp(ops[ops.length - 1]);
  }
  if (ops.length) { S.outbox.push(...ops); persist(); flush(); }
}

function foodLine(k) { return k.lines.find(l => l.track === 'day' && l.total > 0); }
/* Food with carry-over: every day gets the daily target PLUS whatever was left from earlier days
   (or MINUS whatever was overspent). A cheap day makes tomorrow bigger; an expensive day makes it smaller. */
function foodStats(k) {
  const f = foodLine(k); if (!f) return null;
  const target = f.qty > 1 ? f.unit : f.base / k.days;
  const s = dailySeries(k, f.name), ti = k.isCur ? k.elapsed - 1 : k.days;
  const avail = [], over = []; let carry = f.topUp || 0;          // a top-up for Food starts as extra carry
  for (let i = 0; i < k.days; i++) { avail[i] = target + carry; over[i] = s[i] > avail[i]; carry = avail[i] - s[i]; }
  const pastN = k.isCur ? ti : k.days;                            // days that are completely over
  let streak = 0; for (let i = pastN - 1; i >= 0 && !over[i]; i--) streak++;
  const overDays = over.slice(0, pastN).filter(Boolean).length;
  const todayBudget = k.isCur ? avail[ti] : 0, carryIn = k.isCur ? avail[ti] - target : carry;
  let endCarry = f.topUp || 0; for (let i = 0; i < k.days; i++) endCarry += target - s[i];
  return { f, target, s, avail, over, ti, pastN, streak, overDays, todayBudget, carryIn, today: k.isCur ? s[ti] || 0 : 0, endCarry };
}

function foodCard(k) {
  const st = foodStats(k); if (!st || !k.daysLeft) return '';

  </section>`;
}

/* HEMAT nudges: only the ones that matter right now, most useful first. */
function nudges(k) {
  const out = [], t = today();
  if (!k.daysLeft) return out;
  const lastCount = S.counts.slice().sort((a, b) => b.at.localeCompare(a.at))[0];
  const ago = lastCount ? diffDays(lastCount.date, t) : null;
  k.lines.filter(l => l.kind === 'flex' && l.total > 0 && l.status === 'over').forEach(l =>
    out.push({ tone: 'bad', ic: '🛑', text: `<b>${esc(l.name)}</b> is over budget by ${rp(-l.left)}. Anything more here comes out of your savings target.` }));
  k.lines.filter(l => l.kind === 'flex' && l.total > 0 && l.status === 'watch' && l.group === 'want').forEach(l =>
    out.push({ ic: '⚠️', text: `<b>${esc(l.name)}</b> is at ${pct(l.ratio)} of budget on day ${k.elapsed} of ${k.days}. A no-${esc(l.name.toLowerCase())} day or two brings it back on pace.` }));
  (k.c.bills || []).filter(b => !b.paid && diffDays(t, b.due) <= 3).forEach(b =>
    out.push({ tone: diffDays(t, b.due) < 0 ? 'bad' : '', ic: '📅', text: `<b>${esc(b.name)}</b> ${rp(b.amount - (b.paidAmount || 0))} is ${diffDays(t, b.due) < 0 ? 'overdue' : diffDays(t, b.due) === 0 ? 'due today' : `due ${fdw(b.due)}`}. Late fees on paylater add up fast.`, act: ['Mark paid', 'bill-pay', b.id] }));
  if (ago === null || ago >= 3) out.push({ ic: '🧮', text: ago === null ? 'You haven\'t done a cycle count yet. It takes a minute and catches forgotten expenses early.' : `Last cycle count was ${ago} days ago. A quick count keeps the numbers honest.`, act: ['Count now', 'count', ''] });
  const st = foodStats(k);
  if (st && st.carryIn >= st.target * 3) out.push({ tone: 'good', ic: '🍱', text: `You've built up ${rp(st.carryIn)} of unused food budget, about ${Math.floor(st.carryIn / st.target)} extra days. If you won't need it, lower Food in your plan and that money becomes savings.` });
  if (st && st.carryIn <= -st.target) out.push({ tone: 'bad', ic: '🍱', text: `Earlier food overspending has taken ${rp(-st.carryIn)} off today's food budget. A cheaper day or two brings it back.` });
  const ready = (S.settings.wishlist || []).filter(w => w.status === 'waiting' && diffDays(w.added, t) >= COOL_OFF_DAYS);
  if (ready.length) out.push({ ic: '🛍️', text: `${ready.length} wishlist item${ready.length > 1 ? 's have' : ' has'} finished the ${COOL_OFF_DAYS}-day cool-off. Still want ${ready.length > 1 ? 'them' : 'it'}?`, act: ['Decide', 'tab', 'savings'] });
  if (k.daysLeft <= 3 && k.projected > 0) out.push({ tone: 'good', ic: '🎯', text: `Payday is ${k.daysLeft} day${k.daysLeft > 1 ? 's' : ''} away. Sweep what's left of the day-to-day budget into Saving before the new cycle starts.`, act: ['Move to savings', 'save', ''] });
  return out;
}
function nudgeCard(k) {
  const n = nudges(k).slice(0, 3);
  if (!n.length) return `<section class="card"><div class="nudge good"><span class="ic">✅</span><p>Nothing needs your attention. Every budget is on pace.</p></div></section>`;

function billsSoonCard(k) {

function billRow(b, t = today()) {
  const d = diffDays(t, b.due), part = !b.paid && b.paidAmount > 0 ? `, ${rp(b.paidAmount)} paid so far` : '';
  const when = (b.paid ? `Paid${b.paidOn ? ' ' + fd(b.paidOn) : ''}` : d < 0 ? `${-d} day${d < -1 ? 's' : ''} overdue` : d === 0 ? 'Due today' : `Due ${fdw(b.due)}`) + part;

function catRow(l, k) {
  const col = colorOf(l.name), open = S.open[l.name];

     ? `<button class="btn sm ghost" data-act="pay-fixed" data-name="${esc(l.name)}">Log ${rp(l.left)} payment</button>` : '';

    ${open ? `<div class="drill">${items.length ? items.map(e => `<div class="li tap" data-act="edit" data-id="${esc(e.id)}"><div class="main"><b>${esc(e.item)}</b><span>${fdw(e.date)}${e.account ? ', ' + esc(e.account) : ''}</span></div><div class="amt num">${rp(e.amount)}</div></div>`).join('') : '<div class="empty">No entries yet.</div>'}</div>` : ''}
  </div>`;
}

function foodStripCard(k) {
  const st = foodStats(k); if (!st) return '';
  const max = Math.max(st.target * 1.6, ...st.s, 1);
  const bars = st.s.map((v, i) => {
    const fut = k.isCur ? i > st.ti : !k.isPast;
    const cls = fut ? 'fut' : v === 0 ? '' : st.over[i] ? 'bad' : 'ok';
    const h = fut ? 4 : Math.max(3, v / max * 80);
    return `<div title="${fdw(addDays(k.c.start, i))}: spent ${rp(v)} of ${rp(st.avail[i])}"><i class="${cls} ${k.isCur && i === st.ti ? 'today' : ''}" style="height:${h}px"></i></div>`;
  }).join('');
  const avg = st.pastN ? sumA(st.s.slice(0, st.pastN)) / st.pastN : 0;
  return `<section class="card">
    <div class="card-h"><div><h2>${esc(st.f.name)}, day by day</h2><p>${rp(st.target)} a day. Leftovers roll into the next day; overspending comes out of it.</p></div><span class="pill ${st.overDays ? 'watch' : 'ok'}">${st.overDays} day${st.overDays === 1 ? '' : 's'} over</span></div>
    <div class="strip" role="img" aria-label="Food spending per day, green within that day's budget, red above">${bars}</div>
    <div class="strip-axis"><span>${fd(k.c.start)}</span><span>${fd(addDays(k.c.payday, -1))}</span></div>
    <div class="kv" style="margin-top:12px">
      <div><small>${k.isCur ? "Today's budget" : 'Left at the end'}</small><b class="num">${rp(k.isCur ? st.todayBudget : st.endCarry)}</b></div>
      <div><small>Carried into today</small><b class="num" style="color:${st.carryIn < 0 ? 'var(--bad)' : 'var(--ok)'}">${k.isCur ? (st.carryIn >= 0 ? '+' : '−') + rp(Math.abs(st.carryIn)) : '–'}</b></div>
      <div><small>Daily average so far</small><b class="num">${rp(avg)}</b></div>
      <div><small>Used of ${rp(st.f.total)}</small><b class="num">${rp(st.f.spent)}</b></div>
    </div>
  </section>`;
}

/* Fuel with carry-over: each week gets its share PLUS last week's leftover (or MINUS last week's overspend). */
function fuelCard(k) {
  const f = k.lines.find(l => l.track === 'week' && l.total > 0); if (!f) return '';
  const weeks = Math.ceil(k.days / 7), perDay = f.base / k.days, s = dailySeries(k, f.name);
  const curW = k.isCur ? Math.floor((k.elapsed - 1) / 7) : -1;
  let carry = f.topUp || 0;
  const rows = Array.from({ length: weeks }, (_, w) => {
    const a = w * 7, z = Math.min(k.days, a + 7), base = perDay * (z - a), spent = sumA(s.slice(a, z));
    const future = (k.isCur && w > curW) || (!k.isCur && !k.isPast);
    const budget = future ? base : base + carry;     // future weeks only know their base; carry is added when the week arrives
    const r = budget > 0 ? spent / budget : (spent ? 2 : 0), over = spent > budget;
    const note = future ? (w === curW + 1 && carry ? `, plus what's left of this week (${carry > 0 ? '' : '−'}${rp(Math.abs(carry))} so far)` : '')
      : carry ? ` ${carry > 0 ? '+' : '−'}${rp(Math.abs(carry))} ${carry > 0 ? 'carried in' : 'from overspending'}` : '';
    const row = `<div class="cat" style="cursor:default"><div class="t"><div class="n"><b>Week ${w + 1}${w === curW ? ' (now)' : ''}</b><span>${fd(addDays(k.c.start, a))} – ${fd(addDays(k.c.start, z - 1))}. Base ${rp(base)}${note}</span></div>
      <div class="r num"><b>${rp(spent)}</b><span class="mute">of ${rp(budget)}</span></div><span class="pill ${over ? 'over' : future ? '' : 'ok'}">${over ? 'Over' : pct(r)}</span></div>
      <div class="bar"><i style="width:${clamp(r * 100, 0, 100)}%;background:${over ? 'var(--bad)' : colorOf(f.name)}"></i></div></div>`;
    if (!future) carry = budget - spent;      // finished weeks and this week pass their leftover (or overspend) forward
    return row;
  }).join('');
  return `<section class="card"><div class="card-h"><div><h2>${esc(f.name)}, week by week</h2><p>${rp(perDay * 7)} a week. Leftovers roll into next week; overspending comes out of it.</p></div></div>${rows}</section>`;
}

/* ---------- MONEY ---------- */
function lastCount() { return S.counts.slice().sort((a, b) => (b.at || '').localeCompare(a.at || ''))[0] || null; }
function moneyParts() {

    goals: `      <section class="card">

        ${goals.length ? goals.map(g => {

        }).join('') : `<div class="empty">A first goal that fits you: an emergency fund of 3× your monthly needs (${rp(3 * sumA(k.lines.filter(l => l.group !== 'want').map(l => l.total)))}).</div>`}
        <button class="btn ghost block" style="margin-top:12px" data-act="save">Move money to savings</button>
      </section>`,
    wish: `      <section class="card">
        <div class="card-h"><div><h2>Wishlist cool-off</h2><p>Park a want for ${COOL_OFF_DAYS} days before buying.${skipped ? ` Skipping has kept ${rp(skipped)} in your pocket.` : ''}</p></div><button class="link" data-act="wish-new">Add</button></div>
        ${wish.length ? wish.map(w => {
          const wait = COOL_OFF_DAYS - diffDays(w.added, today());
          return `<div class="li"><div class="main"><b>${esc(w.name)}</b><span>${rp(w.price)}${hourly ? `, about ${Math.max(1, Math.round(w.price / hourly))} hours of work` : ''}</span></div>
            ${wait > 0 ? `<span class="pill">${wait} day${wait > 1 ? 's' : ''} left</span>` : `<div class="row" style="flex-wrap:nowrap"><button class="btn sm ghost" data-act="wish-skip" data-id="${esc(w.id)}">Skip</button><button class="btn sm" data-act="wish-buy" data-id="${esc(w.id)}">Buy</button></div>`}</div>`;

}

function readCount() {
  const draft = store.get('bi.countDraft', {}), accs = S.settings.accounts;
  const balances = {}; let missing = 0;
  accs.forEach(a => { const v = draft[a.name]; if (v === undefined || v === '') { if (a.count) missing++; } else balances[a.name] = parseMoney(v); });
  const counted = sumA(accs.filter(a => a.count).map(a => balances[a.name] || 0));
  return { balances, counted, missing };
}
function updateCountResult() {
  const box = $('#cnt-result'); if (!box) return;
  const k = calc(curCycle()), r = readCount(), diff = r.counted - k.shouldHave;
  $('#cnt-total').textContent = rp(r.counted);
  if (r.missing === S.settings.accounts.filter(a => a.count).length) { box.innerHTML = ''; return; }
  if (r.missing) { box.innerHTML = `<div class="result"><p class="small">${r.missing} account${r.missing > 1 ? 's are' : ' is'} still empty. Type 0 if it really is empty.</p></div>`; return; }
  const ok = Math.abs(diff) < 1;
  box.innerHTML = `<div class="result ${ok ? 'ok' : 'bad'}">
    <div class="big2 num">${ok ? 'Matches' : (diff > 0 ? '+' : '−') + rp(Math.abs(diff)).replace('−', '')}</div>
    <p class="small">${ok ? 'Your real money matches the app. Nice and tidy.' : diff < 0
      ? `You have ${rp(-diff)} less than expected. Usually an expense you forgot to log.`
      : `You have ${rp(diff)} more than expected. Maybe a refund, a gift, or an IOU paid back.`}</p>

    text: `${on.length} of ${flex.length} day-to-day budgets are on pace.${offPace.length ? ` Ahead of pace: ${offPace.join(', ')}.` : ''}${k.unplanned.length ? ` Spending outside the plan: ${k.unplanned.map(u => u.name).join(', ')}.` : ''}` });
  const due = (k.c.bills || []).filter(b => b.due <= t), paid = due.filter(b => b.paid);

  const dr = k.income ? k.billsTotal / k.income : 0;

    text: `Bills take ${pct(dr)} of salary. Under 15% is comfortable; above 30% squeezes everything else.` });
  const lc = lastCount(), age = lc ? diffDays(lc.date, t) : null, match = lc && Math.abs(lc.diff) < 1000;
  comps.push({ name: 'Money matches the app', max: 10, pts: age === null ? 0 : age <= 3 ? (match ? 10 : 4) : age <= 7 ? (match ? 7 : 3) : 0,

function frequent() {

  const rows = names.map(nm => ({ nm, a: k.spentBy[nm] || 0, b: prevBy[nm] || 0 })).map(r => Object.assign(r, { d: r.a - r.b }))
    .filter(r => r.d).sort((x, y) => Math.abs(y.d) - Math.abs(x.d)).slice(0, 6);
  const tA = sumE(k.exp), tB = sumA(Object.values(prevBy));
  return `<section class="card"><div class="card-h"><div><h2>Compared with last cycle</h2><p>First ${n} days of each cycle</p></div><span class="pill ${tA > tB ? 'over' : 'ok'}">${tA > tB ? '+' : ''}${short(tA - tB)}</span></div>
    ${rows.length ? rows.map(r => `<div class="li"><span class="dot" style="background:${colorOf(r.nm)}"></span><div class="main"><b>${esc(r.nm)}</b><span>${rp(r.b)} then, ${rp(r.a)} now</span></div><div class="amt num" style="color:${r.d > 0 ? 'var(--bad)' : 'var(--ok)'}">${r.d > 0 ? '+' : '−'}${rp(Math.abs(r.d))}</div></div>`).join('') : '<div class="empty">Same spending as last cycle so far.</div>'}</section>`;
}

function mixCard(k) {

  const grp = g => sumA(k.lines.filter(l => l.group === g).map(l => Math.max(l.total, l.spent))) + (g === 'want' ? sumA(k.unplanned.map(u => u.spent)) : 0);
  const parts = [['Needs', grp('need'), '#3E7CB1', .5], ['Wants', grp('want'), '#D99A00', .3], ['Bills & debt', grp('debt'), '#D1495B', 0], ['Savings', Math.max(0, k.projected), '#1F8A70', .2]];

function repeatCard() {

function weekdayCard() {
  const from = addDays(today(), -56), sums = [0,0,0,0,0,0,0], cnt = [0,0,0,0,0,0,0];
  const fixed = new Set(); S.cycles.forEach(c => c.lines.forEach(l => { if (l.kind !== 'flex') fixed.add(l.name); }));
  for (let i = 0; i < 56; i++) cnt[pd(addDays(from, i)).getDay()]++;
  S.expenses.filter(e => e.type === 'expense' && e.date >= from && !fixed.has(e.category)).forEach(e => sums[pd(e.date).getDay()] += e.amount);
  const avg = sums.map((s, i) => cnt[i] ? s / cnt[i] : 0), max = Math.max(...avg, 1), top = avg.indexOf(Math.max(...avg));
  const names = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], order = [1,2,3,4,5,6,0];

function historyCard() {
  const rows = cyclesAsc().map(c => { const k = calc(c); const inc = k.income + k.extra, saved = k.isCur ? k.projected : inc - k.spent;
    return { c, k, inc, saved, rate: inc ? saved / inc : 0, tRate: k.targetPct, live: k.isCur || !k.isPast }; });
  const first = cyclesAsc()[0], legacy = {};
  S.expenses.filter(e => first && e.date < first.start && e.type === 'expense').forEach(e => { const m = e.date.slice(0, 7); legacy[m] = (legacy[m] || 0) + e.amount; });
  const closed = rows.filter(r => !r.live), total = sumA(closed.map(r => r.saved)), hit = closed.filter(r => r.saved >= r.k.target).length;
  const last = rows.slice(-8), W = 320, H = 110, bw = W / Math.max(last.length, 1);
  const bars = last.map((r, i) => {

  }).join('');
  return `<section class="card"><div class="card-h"><div><h2>Cycle history</h2><p>${closed.length ? `Saved ${rp(total)} across ${closed.length} closed cycle${closed.length > 1 ? 's' : ''}. Target hit ${hit} of ${closed.length}.` : 'Your first cycle is still running. Each closed cycle keeps its own plan here.'}</p></div></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:520px;height:auto" role="img" aria-label="Savings rate per cycle; the black line is the target">${bars}</svg>
    <p class="tiny mute">Bars show savings as a share of income. The dark line on each bar is that cycle's target. The pale bar is the current cycle's projection.</p>
    <div class="scrollx" style="margin-top:10px"><table class="table"><thead><tr><th>Cycle</th><th>Income</th><th>Spent</th><th>Saved</th><th>Rate</th></tr></thead><tbody>
      ${rows.slice().reverse().map(r => `<tr data-act="open-recap" data-id="${esc(r.c.id)}" style="cursor:pointer"><td>${fd(r.c.start, {day:'numeric', month:'short', year:'2-digit'})}${r.live ? ' (now)' : ''}</td><td class="num">${short(r.inc)}</td><td class="num">${short(r.k.spent)}</td><td class="num" style="color:${r.saved >= r.k.target ? 'var(--ok)' : 'var(--warn)'}">${short(r.saved)}</td><td class="num">${pct(r.rate)}</td></tr>`).join('')}
      ${Object.keys(legacy).sort().reverse().map(m => `<tr><td>${fd(m + '-01', {month:'short', year:'2-digit'})} (old)</td><td>–</td><td class="num">${short(legacy[m])}</td><td>–</td><td>–</td></tr>`).join('')}

const KW = {

  Snacks: ['jajan','snack','cemilan','boba','kopi','coffee','es teh','martabak','gorengan','roti','pukis','chatime','mixue','starbucks','janji jiwa','kenangan'],
  Groceries: ['beras','telur','sabun','sampo','shampoo','odol','sayur','galon','bumbu','minyak','alfamart','indomaret','superindo','tissue','tisu','softex','deterjen'],
  Fuel: ['bensin','pertalite','pertamax','shell','bbm'],
  Parking: ['parkir','parking'],
  Laundry: ['laundry','londri'],
  'Data & iCloud': ['kuota','pulsa','icloud','google one','paket data','wifi'],
  Skincare: ['skincare','serum','sunscreen','toner','moisturizer','facial'],
  Emergency: ['obat','apotek','klinik','dokter','darurat','rumah sakit'],
  Electricity: ['listrik','token pln','pln'],
  Boarding: ['kos','kost'],
  Admin: ['admin','biaya transfer']
};
function guessCat(item) {
  const lines = curCycle().lines.map(l => l.name), t = item.toLowerCase().trim();
  const past = S.expenses.slice().reverse().find(e => e.type === 'expense' && e.item.toLowerCase().trim() === t);
  if (past && lines.includes(past.category)) return past.category;
  for (const [c, words] of Object.entries(KW)) if (lines.includes(c) && words.some(w => t.includes(w))) return c;
  return lines.includes('Others') ? 'Others' : lines[0];
}
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function parseText(text, baseDate, defAcc) {
  const accs = S.settings.accounts.map(a => a.name);
  return text.split(/\n|;|,(?!\d)/).map(s => s.trim()).filter(Boolean).map((seg, idx) => {
    let s = seg, type = 'expense', date = baseDate, account = '';
    if (/^\+/.test(s)) { type = 'income'; s = s.slice(1).trim(); }
    if (/\b(kemarin|kmrn|yesterday)\b/i.test(s)) { date = addDays(baseDate, -1); s = s.replace(/\b(kemarin|kmrn|yesterday)\b/ig, ' '); }
    for (const a of accs) {
      const key = a.split(/[\s/]+/)[0];
      const re = new RegExp('(^|\\s)@?' + escRe(key) + '(?=\\s|$)', 'i');
      if (key.length >= 3 && re.test(s)) { account = a; s = s.replace(re, ' '); break; }
    }
    const re = /(\d+(?:[.,]\d+)*)\s*(k|rb|ribu|jt|juta)?(?![a-z])/ig; let m, all = [];
    while ((m = re.exec(s))) all.push({ raw: m[1], suf: m[2] || '', i: m.index, len: m[0].length });
    if (!all.length) return null;
    const pick = all.filter(x => x.suf).pop() || all[all.length - 1];
    let amount = toAmount(pick.raw, pick.suf);
    if (!pick.suf && amount > 0 && amount < 1000) amount *= 1000;     // "kopi 18" means 18k
    const item = (s.slice(0, pick.i) + ' ' + s.slice(pick.i + pick.len)).replace(/\s+/g, ' ').replace(/^[\s:=\-–@]+|[\s:=\-–@]+$/g, '').trim() || (type === 'income' ? 'Income' : 'Expense');
    return { key: idx + '|' + seg, item: item.charAt(0).toUpperCase() + item.slice(1), amount, category: type === 'income' ? 'Income' : guessCat(item), account: account || defAcc, date, type };
  }).filter(r => r && r.amount > 0);
}

}
const pendingMsg = () => { const m = S.sheet && S.sheet.msgs; if (!m) return null; for (let i = m.length - 1; i >= 0; i--) if (m[i].items && m[i].status === 'pending') return m[i]; return null; };
function chatHTML() {
  const sh = S.sheet, out = [];

      : `<div class="plist">${m.items.map(r => `<div class="pi"><div><b>${esc(r.item)}</b><span>${esc(r.type === 'income' ? 'Money in' : r.category)}${r.account ? ', ' + esc(r.account) : ''}${r.date !== today() ? ', ' + fdw(r.date) : ''}${m.status === 'pending' ? billNote(r) + wantNote(r) : (r.noteSnap || '')}</span></div><b class="num ${r.type === 'income' ? 'in' : ''}">${r.type === 'income' ? '+' : ''}${rp(r.amount)}</b></div>`).join('')}
         <div class="pi tot"><span>Total spent</span><b class="num">${rp(sumE(exp))}</b></div>${inc.length ? `<div class="pi"><span>Money in</span><b class="num in">+${rp(sumE(inc))}</b></div>` : ''}</div>`;

  }).filter(x => x.amount > 0);

async function aiSend(text) {
  const sh = S.sheet; text = (text || '').trim(); if (!text || sh.busy) return;
  const prev = pendingMsg();
  sh.msgs.push({ role: 'me', text }); sh.busy = true; sh.draftText = '';
  const ta = $('#ai-in'); if (ta) ta.value = '';
  renderChat();
  const c = curCycle();
  let res, local = false;
  try {
    res = await api('ai_parse', { text, today: sh.date, categories: c.lines.map(l => l.name), accounts: S.settings.accounts.map(a => a.name),
      bills: (c.bills || []).filter(b => !b.paid).map(b => ({ id: b.id, name: b.name, amount: b.amount - (b.paidAmount || 0) })),
      previous: prev ? prev.items.map(({ item, amount, category, account, date, type, billId }) => ({ item, amount, category, account, date, type, billId })) : null }, 45000);
  } catch (e) {
    local = true;
    const rows = parseText(prev ? prev.items.map(r => `${r.item} ${r.amount}`).join(', ') + ', ' + text : text, sh.date, sh.account);
    res = { items: rows, reply: rows.length ? `I read ${rows.length} item${rows.length > 1 ? 's' : ''}.` : '', question: '' };
    if (e.auth) setSync('signin');
  }
  if (!S.sheet) return;
  const items = cleanItems(res.items, sh.date, sh.account);
  if (prev) prev.status = 'replaced';
  if (!items.length) sh.msgs.push({ role: 'ai', text: res.question || "I couldn't find any amounts in that. Try something like \"bakso 23k\"." });
  else sh.msgs.push({ role: 'ai', items, reply: res.reply || `Got ${items.length} item${items.length > 1 ? 's' : ''}.`, question: res.question || '', status: 'pending', local });
  sh.busy = false; renderChat();
}
