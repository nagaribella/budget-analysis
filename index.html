  const grp = g => sumA(k.lines.filter(l => l.group === g).map(l => Math.max(l.total, l.spent))) + (g === 'want' ? sumA(k.unplanned.map(u => u.spent)) : 0);
  const parts = [['Needs', grp('need'), '#3E7CB1', .5], ['Wants', grp('want'), '#D99A00', .3], ['Bills & debt', grp('debt'), '#D1495B', 0], ['Savings', Math.max(0, k.projected), '#1F8A70', .2]];

  const wants = parts[1][1] / inc;
  return `<section class="card"><div class="card-h"><div><h2>Where the salary goes</h2><p>Planned spending plus projected savings, as a share of income</p></div></div>

}

function repeatCard() {
  const from = addDays(today(), -30), map = new Map();

function weekdayCard() {
  const from = addDays(today(), -56), sums = [0,0,0,0,0,0,0], cnt = [0,0,0,0,0,0,0];
  const fixed = new Set(); S.cycles.forEach(c => c.lines.forEach(l => { if (l.kind !== 'flex') fixed.add(l.name); }));
  for (let i = 0; i < 56; i++) cnt[pd(addDays(from, i)).getDay()]++;
  S.expenses.filter(e => e.type === 'expense' && e.date >= from && !fixed.has(e.category)).forEach(e => sums[pd(e.date).getDay()] += e.amount);
  const avg = sums.map((s, i) => cnt[i] ? s / cnt[i] : 0), max = Math.max(...avg, 1), top = avg.indexOf(Math.max(...avg));
  const names = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], order = [1,2,3,4,5,6,0];
  if (!sumA(avg)) return '';
  return `<section class="card"><div class="card-h"><div><h2>Your spending week</h2><p>Average day-to-day spending, last 8 weeks</p></div></div>
    <div class="strip" style="height:90px;gap:8px">${order.map(i => `<div title="${names[i]}: ${rp(avg[i])}"><i style="height:${Math.max(3, avg[i] / max * 70)}px;background:${i === top ? 'var(--gold)' : 'var(--brand-soft)'}"></i><small class="tiny mute" style="text-align:center;margin-top:4px">${names[i]}</small></div>`).join('')}</div>
    <p class="small" style="margin-top:10px">${names[top]} is your biggest day at ${rp(avg[top])} on average. Plan that day's food ahead and it stops being a leak.</p></section>`;
}

function historyCard() {
  const rows = cyclesAsc().map(c => { const k = calc(c); const inc = k.income + k.extra, saved = k.isCur ? k.projected : inc - k.spent;
    return { c, k, inc, saved, rate: inc ? saved / inc : 0, tRate: k.targetPct, live: k.isCur || !k.isPast }; });
  const first = cyclesAsc()[0], legacy = {};
  S.expenses.filter(e => first && e.date < first.start && e.type === 'expense').forEach(e => { const m = e.date.slice(0, 7); legacy[m] = (legacy[m] || 0) + e.amount; });
  const closed = rows.filter(r => !r.live), total = sumA(closed.map(r => r.saved)), hit = closed.filter(r => r.saved >= r.k.target).length;
  const last = rows.slice(-8), W = 320, H = 110, bw = W / Math.max(last.length, 1);
  const bars = last.map((r, i) => {
    const h = clamp(r.rate, 0, 1) * (H - 20), th = clamp(r.tRate, 0, 1) * (H - 20), x = i * bw + bw * .2, w = bw * .6;
    return `<rect x="${x}" y="${H - 14 - h}" width="${w}" height="${h}" rx="3" style="fill:${r.live ? 'var(--brand-soft)' : r.saved >= r.k.target ? 'var(--ok)' : 'var(--warn)'}"/>
      <line x1="${x - 3}" x2="${x + w + 3}" y1="${H - 14 - th}" y2="${H - 14 - th}" style="stroke:var(--ink);stroke-width:2"/>
      <text x="${x + w / 2}" y="${H - 2}" text-anchor="middle" style="font:600 10px var(--sans);fill:var(--mute)">${fd(r.c.start, {month:'short'})}</text>`;
  }).join('');
  return `<section class="card"><div class="card-h"><div><h2>Cycle history</h2><p>${closed.length ? `Saved ${rp(total)} across ${closed.length} closed cycle${closed.length > 1 ? 's' : ''}. Target hit ${hit} of ${closed.length}.` : 'Your first cycle is still running. Each closed cycle keeps its own plan here.'}</p></div></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:520px;height:auto" role="img" aria-label="Savings rate per cycle; the black line is the target">${bars}</svg>
    <p class="tiny mute">Bars show savings as a share of income. The dark line on each bar is that cycle's target. The pale bar is the current cycle's projection.</p>
    <div class="scrollx" style="margin-top:10px"><table class="table"><thead><tr><th>Cycle</th><th>Income</th><th>Spent</th><th>Saved</th><th>Rate</th></tr></thead><tbody>
      ${rows.slice().reverse().map(r => `<tr data-act="open-cycle" data-id="${esc(r.c.id)}" style="cursor:pointer"><td>${fd(r.c.start, {day:'numeric', month:'short', year:'2-digit'})}${r.live ? ' (now)' : ''}</td><td class="num">${short(r.inc)}</td><td class="num">${short(r.k.spent)}</td><td class="num" style="color:${r.saved >= r.k.target ? 'var(--ok)' : 'var(--warn)'}">${short(r.saved)}</td><td class="num">${pct(r.rate)}</td></tr>`).join('')}
      ${Object.keys(legacy).sort().reverse().map(m => `<tr><td>${fd(m + '-01', {month:'short', year:'2-digit'})} (old)</td><td>–</td><td class="num">${short(legacy[m])}</td><td>–</td><td>–</td></tr>`).join('')}
    </tbody></table></div></section>`;
}

const KW = {
  Food: ['makan','nasi','mie','bakso','ayam','sate','soto','bubur','geprek','gacoan','warteg','padang','gofood','grabfood','shopeefood','sarapan','lunch','dinner','breakfast'],
  Snacks: ['jajan','snack','cemilan','boba','kopi','coffee','es teh','martabak','gorengan','roti','pukis','chatime','mixue','starbucks','janji jiwa','kenangan'],
  Groceries: ['beras','telur','sabun','sampo','shampoo','odol','sayur','galon','bumbu','minyak','alfamart','indomaret','superindo','tissue','tisu','softex','deterjen'],
  Fuel: ['bensin','pertalite','pertamax','shell','bbm'],
  Parking: ['parkir','parking'],
  Laundry: ['laundry','londri'],
  'Data & iCloud': ['kuota','pulsa','icloud','google one','paket data','wifi'],
  Skincare: ['skincare','serum','sunscreen','toner','moisturizer','facial'],
  Emergency: ['obat','apotek','klinik','dokter','darurat','rumah sakit'],
  Electricity: ['listrik','token pln','pln'],
  Boarding: ['kos','kost'],
  Admin: ['admin','biaya transfer']
};
function guessCat(item) {
  const lines = curCycle().lines.map(l => l.name), t = item.toLowerCase().trim();
  const past = S.expenses.slice().reverse().find(e => e.type === 'expense' && e.item.toLowerCase().trim() === t);
  if (past && lines.includes(past.category)) return past.category;
  for (const [c, words] of Object.entries(KW)) if (lines.includes(c) && words.some(w => t.includes(w))) return c;
  return lines.includes('Others') ? 'Others' : lines[0];
}
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function parseText(text, baseDate, defAcc) {
  const accs = S.settings.accounts.map(a => a.name);
  return text.split(/\n|;|,(?!\d)/).map(s => s.trim()).filter(Boolean).map((seg, idx) => {
    let s = seg, type = 'expense', date = baseDate, account = '';
    if (/^\+/.test(s)) { type = 'income'; s = s.slice(1).trim(); }
    if (/\b(kemarin|kmrn|yesterday)\b/i.test(s)) { date = addDays(baseDate, -1); s = s.replace(/\b(kemarin|kmrn|yesterday)\b/ig, ' '); }
    for (const a of accs) {
      const key = a.split(/[\s/]+/)[0];
      const re = new RegExp('(^|\\s)@?' + escRe(key) + '(?=\\s|$)', 'i');
      if (key.length >= 3 && re.test(s)) { account = a; s = s.replace(re, ' '); break; }
    }
    const re = /(\d+(?:[.,]\d+)*)\s*(k|rb|ribu|jt|juta)?(?![a-z])/ig; let m, all = [];
    while ((m = re.exec(s))) all.push({ raw: m[1], suf: m[2] || '', i: m.index, len: m[0].length });
    if (!all.length) return null;
    const pick = all.filter(x => x.suf).pop() || all[all.length - 1];
    let amount = toAmount(pick.raw, pick.suf);
    if (!pick.suf && amount > 0 && amount < 1000) amount *= 1000;     // "kopi 18" means 18k
    const item = (s.slice(0, pick.i) + ' ' + s.slice(pick.i + pick.len)).replace(/\s+/g, ' ').replace(/^[\s:=\-–@]+|[\s:=\-–@]+$/g, '').trim() || (type === 'income' ? 'Income' : 'Expense');
    return { key: idx + '|' + seg, item: item.charAt(0).toUpperCase() + item.slice(1), amount, category: type === 'income' ? 'Income' : guessCat(item), account: account || defAcc, date, type };
  }).filter(r => r && r.amount > 0);
}

function cleanItems(list, fallbackDate, defAcc) {
  const c = curCycle(), cats = c.lines.map(l => l.name), accs = S.settings.accounts.map(a => a.name), bills = (c.bills || []).map(b => b.id);
  return (Array.isArray(list) ? list : []).map(x => {
    const type = x.type === 'income' ? 'income' : 'expense';
    const item = String(x.item || '').trim().slice(0, 80) || (type === 'income' ? 'Income' : 'Expense');
    const billId = bills.includes(x.billId) ? x.billId : '';
    let category = type === 'income' ? 'Income' : cats.includes(x.category) ? x.category : (billId && cats.includes('Bills') ? 'Bills' : guessCat(item));
    return { item: item.charAt(0).toUpperCase() + item.slice(1), amount: Math.round(Number(x.amount) || 0), category, type, billId,
      account: accs.includes(x.account) ? x.account : (defAcc || ''), date: /^\d{4}-\d{2}-\d{2}$/.test(x.date || '') && x.date <= today() ? x.date : fallbackDate };
  }).filter(x => x.amount > 0);
}
async function aiSend(text) {
  const sh = S.sheet; text = (text || '').trim(); if (!text || sh.busy) return;
  const prev = pendingMsg();
  sh.msgs.push({ role: 'me', text }); sh.busy = true; sh.draftText = '';
  const ta = $('#ai-in'); if (ta) ta.value = '';
  renderChat();
  const c = curCycle();
  let res, local = false;
  try {
    res = await api('ai_parse', { text, today: sh.date, categories: c.lines.map(l => l.name), accounts: S.settings.accounts.map(a => a.name),
      bills: (c.bills || []).filter(b => !b.paid).map(b => ({ id: b.id, name: b.name, amount: b.amount - (b.paidAmount || 0) })),
      previous: prev ? prev.items.map(({ item, amount, category, account, date, type, billId }) => ({ item, amount, category, account, date, type, billId })) : null }, 45000);
  } catch (e) {
    local = true;
    const rows = parseText(prev ? prev.items.map(r => `${r.item} ${r.amount}`).join(', ') + ', ' + text : text, sh.date, sh.account);
    res = { items: rows, reply: rows.length ? `I read ${rows.length} item${rows.length > 1 ? 's' : ''}.` : '', question: '' };
    if (e.auth) setSync('signin');
  }
  if (!S.sheet) return;
  const items = cleanItems(res.items, sh.date, sh.account);
  if (prev) prev.status = 'replaced';
  if (!items.length) sh.msgs.push({ role: 'ai', text: res.question || "I couldn't find any amounts in that. Try something like \"bakso 23k\"." });
  else sh.msgs.push({ role: 'ai', items, reply: res.reply || `Got ${items.length} item${items.length > 1 ? 's' : ''}.`, question: res.question || '', status: 'pending', local });
  sh.busy = false; renderChat();
}

  },

  ev.preventDefault(); fn(el.dataset, el);

function onField(ev) {
  const t = ev.target, ds = t.dataset, sh = S.sheet;
  if (t.id === 'ai-in') { sh.draftText = t.value; return; }
  if (t.id === 'qa-acc') { sh.account = t.value; return; }
  if (ds.qf) {
    const row = t.closest('.prow'), m = sh.msgs[+row.dataset.m], it = m && m.items[+row.dataset.i]; if (!it) return;
    it[ds.qf] = ds.qf === 'amount' ? parseMoney(t.value) : t.value;
    return;
  }
  if (ds.count !== undefined) { const d = store.get('bi.countDraft', {}); d[ds.count] = t.value; store.set('bi.countDraft', d); return updateCountResult(); }
  if (ds.pf || ds.lf || ds.bf) {
    const d = sh.draft, money = t.classList.contains('money');
    const val = t.type === 'checkbox' ? t.checked : money ? parseMoney(t.value) : (ds.lf === 'qty' ? Number(t.value) || 0 : t.value);
    if (ds.pf) d[ds.pf] = val;
    if (ds.lf) { d.lines[+ds.i][ds.lf] = val; const el = $(`[data-lt="${ds.i}"]`); if (el) el.textContent = '= ' + rp(lineTotal(d.lines[+ds.i], d)); }
    if (ds.bf) d.bills[+ds.i][ds.bf] = val;
    const total = sumA(d.lines.map(l => lineTotal(l, d))); $('#plan-tot').innerHTML = planTot(total, (Number(d.income) || 0) - total, d);
    return;
  }
  if (ds.af) { const a = sh.draft.accounts[+ds.i]; a[ds.af] = t.type === 'checkbox' ? t.checked : t.value; }
  if ((t.id === 'ln-qty' || t.id === 'ln-unit') && $('#ln-tot')) $('#ln-tot').textContent = 'Total ' + rp((Number($('#ln-qty').value) || 0) * parseMoney($('#ln-unit').value));
}
document.addEventListener('input', onField);
document.addEventListener('change', ev => { if (ev.target.type === 'checkbox' || ev.target.tagName === 'SELECT' || ev.target.type === 'date') onField(ev); });
document.addEventListener('focusout', ev => { const t = ev.target; if (t.classList && t.classList.contains('money') && t.value.trim()) { t.value = mval(parseMoney(t.value)) || '0'; } });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && !ev.shiftKey && ev.target.id === 'ai-in') { ev.preventDefault(); ACT['ai-send'](); }
  if (ev.key === 'Enter' && !ev.shiftKey && ev.target.id === 'ask-in') { ev.preventDefault(); ACT.ask({}); }
});

/* ---------- Sign in with Google ---------- */
let gisReady = false, authWaiters = [];
const jwtPayload = t => JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')))));
function gisInit() {
  if (gisReady || !CONFIGURED || !(window.google && google.accounts && google.accounts.id)) return;
  google.accounts.id.initialize({ client_id: APP.clientId, callback: onCredential, auto_select: true,
    cancel_on_tap_outside: false, use_fedcm_for_prompt: true, itp_support: true });
  gisReady = true;
  if (!AUTH) { renderGoogleButton(); google.accounts.id.prompt(); }
}
function renderGoogleButton() {
  const el = $('#gbtn'); if (!el || !gisReady) return;
  google.accounts.id.renderButton(el, { theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', width: 280 });
}
function onCredential(resp) {
  let pl; try { pl = jwtPayload(resp.credential); } catch (e) { return; }
  const first = !AUTH;
  AUTH = { token: resp.credential, exp: pl.exp * 1000, email: pl.email, name: pl.given_name || pl.name || '', picture: pl.picture || '' };
  store.set('bi.auth', AUTH); S.authMsg = '';
  const w = authWaiters; authWaiters = []; w.forEach(f => f.res(AUTH.token));
  if (first) { render(); pull(); } else if (S.sync === 'signin') { setSync('idle'); flush().then(pull); }
}
/* Google ID tokens last 1 hour. This asks Google for a new one without a click when possible. */
function silentRefresh() {
  return new Promise((res, rej) => {
    gisInit(); if (!gisReady) return rej(authErr());
    authWaiters.push({ res, rej });
    try { google.accounts.id.prompt(); } catch (e) {}
    setTimeout(() => { const i = authWaiters.findIndex(f => f.res === res); if (i >= 0) { authWaiters.splice(i, 1); rej(authErr()); } }, 12000);
  });
}
function signOut(msg) {
  if (S.outbox.length && !msg && !confirm(`${S.outbox.length} change(s) haven't reached your sheet yet and will be lost. Sign out anyway?`)) return;
  try { if (gisReady) google.accounts.id.disableAutoSelect(); } catch (e) {}
  AUTH = null; ['bi.auth', 'bi.cache', 'bi.outbox', 'bi.countDraft'].forEach(k => store.del(k));
  Object.assign(S, { expenses: [], cycles: [], counts: [], settings: null, outbox: [], loaded: false, authMsg: msg || '', sync: 'idle' });
  closeSheet(); render();
}


/* ---------- start ---------- */
(function init() {
  const cache = store.get('bi.cache', null);
  if (cache) { S.expenses = (cache.expenses || []).map(normExp); S.cycles = cache.cycles || []; S.counts = cache.counts || []; S.settings = cache.settings; }
  render();
  if (AUTH) pull();
  setInterval(() => { if (document.visibilityState === 'visible' && !S.sheet) pull(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); });
  window.addEventListener('online', () => pull());
  let day = today(); setInterval(() => { if (today() !== day) { day = today(); safeRender(); } }, 60000);
})();
</script>
<script src="https://accounts.google.com/gsi/client" async onload="gisInit()"></script>
